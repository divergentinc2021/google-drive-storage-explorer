appId: com.divergentinc.diskstorageexplorer
productName: Disk Storage Explorer
copyright: UWC Immersive Zone

directories:
  output: dist
  buildResources: build

# ui/ is generated by build-ui.mjs from ../apps-script, so it must be packaged
# but is NOT in git — the build script has to run before electron-builder.
files:
  - main.cjs
  - preload.cjs
  - scan.mjs
  - ui/**/*
  - package.json

win:
  target: [nsis]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Distinct from the storage-mapper installer, which also ships a "Storage"
  # product — identical filenames in a Downloads folder is how people install
  # the wrong one and report the wrong bug.
  artifactName: DiskStorageExplorer-Setup-${version}.${ext}

mac:
  target: [dmg]
  category: public.app-category.utilities
