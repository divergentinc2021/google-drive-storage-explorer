<style>
/*
  Colour tokens.

  The two data ramps below were DERIVED AND VALIDATED, not hand-picked
  (tools/make_ramp.mjs + the dataviz validator). Do not "tidy" them by eye.

  SIZE = sequential, MULTI-HUE, monotone L.
    Light mode runs near-white neutral → gold → orange → red → deep purple-red;
    dark mode runs the same path the other way, purple-black → maroon → flame →
    bright yellow, so the biggest is always the most prominent against its
    surface. That inverts which end the purple sits on between the two themes —
    inherent, since on a dark plane the largest thing must be the brightest.

    The hue path is expressed with NEGATIVE angles (104° → −24°) to keep it on
    the warm arc. Writing −24° as +336° makes the interpolation walk the long way
    round through green, cyan and blue; that was measured and scores BETTER on
    adjacent separation (.1141 vs .1027) purely because it stops being ordered.
    Adjacent separation only means anything while the ramp is still sequential.

    SPACING IS ALREADY SOLVED — do not "even out" these stops. Adjacent-gap
    uniformity is 1.11 here and 1.06 in dark mode (1.00 = perfect), and 1.03/1.02
    for age. Re-placing the stops at equal ARC LENGTH along the OKLCH path, which
    is the textbook move, was tried and gave uniformity of 1.5–2.0 — much worse.
    Arc length is distance along a curve; what the eye compares between two
    touching tiles is the CHORD, and a hue-rotating path curves hard enough
    through the a-b plane that equal arcs give badly unequal chords.

    Hue was added because the map is now shaded: relief + ambient occlusion
    swing lightness WITHIN one tile by a median of 2.44 adjacent ramp steps, so
    a ramp that varies only in lightness is partly drowned out by its own 3D.
    Hue is the one channel the shading cannot touch. Minimum adjacent OKLab
    distance .0744 → .0874, and both CVD simulations improved.

    THE NEGLIGIBLE END IS YELLOW, and earlier versions of this comment argued
    the opposite — that the near-zero step should recede into the surface so
    tiny files read as plain grey. That exemption was correct until container
    tiles were changed to fill with --surface-1. Once the scaffolding itself is
    surface-coloured, a near-white smallest step is not receding into the
    BACKGROUND, it is colliding with the CHROME: a negligible file and an empty
    gutter became the same colour. Step 0 measured 0.0216 from --surface-1; it is
    now 0.1273, roughly 1.7 ramp steps, so a tiny file reads as a tiny file.

    Widening the ramp that way also removed the need for the lightness gamma —
    the span went .630 → .685 and supplies the colour-blind headroom the gamma
    was buying, at minAdj .1094 and uniformity 1.06 against the old .1021/1.11.

  AGE = ordinal. The bands are ORDERED, so the ramp must be rankable by eye.
    It walks green -> turquoise -> teal -> blue -> navy: hue rotates 146->258
    monotonically WHILE lightness falls monotonically. Minimum adjacent OKLab
    distance is .1577 in light mode and .1590 in dark, against .098/.1005 for the
    single blue this replaced, with all three CVD simulations improving.

    SKY BLUE AT THE RECENT END WAS TESTED AND REJECTED. It was proposed to raise
    contrast and it does the reverse: sky blue sits near hue 230, CLOSER to the
    navy at 255 than green at 150 is, so the hue span collapses from 105° to 25°.
    Measured, minAdj .1421 -> .1359 and the ends went from .5686 to .5422 apart.
    A punchier recent end comes from keeping green and raising its chroma
    (.110 -> .155) plus widening the lightness span — which is what shipped.

    The recent end is a LIGHT green, and that is a constraint rather than a
    preference. A DARK green for "most recent" was asked for and measured: it
    cannot work sequentially, because the oldest band already owns the dark end,
    so darkening the newest puts both extremes at one lightness. Built properly
    as a diverging ramp (dark green → pale middle → dark navy) adjacent
    separation rises to .2212 — but the two ENDS fall to .1911 apart against
    .5731 here, and .0619 under tritanopia. Those ends are "leave alone" and
    "move to the NAS": the two opposite actions, and the pair you can least
    afford to confuse while scanning hundreds of tiles.

    Also rejected: these colours as a PALETTE at co-equal lightness. Higher mean
    distance, still wrong — unordered hues cannot be ranked without the legend,
    and it failed lightness-monotonicity under both deuteranopia and protanopia.
    Monotone L is what lets a multi-hue ramp degrade to a usable greyscale one;
    give it up and the ramp stops being a ramp.

  TILE INK is NOT a token per theme. A treemap tile's background is whatever
  step of the ramp its value landed on plus whatever the relief shading did to
  it, so one fixed ink cannot work: #0b0b0b on --size-7 is the unreadable black
  -on-red the map used to ship. Treemap.html samples the pixels each label is
  about to cover and picks whichever of the two inks below wins the contrast
  ratio, so these are deliberately theme-independent candidates, not a value.
*/
.viz-root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --plane: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, .10);
  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.06);

  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;

  --size-0: #fce68f; --size-1: #fab949; --size-2: #ef8b20; --size-3: #dd5c20;
  --size-4: #c12c33; --size-5: #980042; --size-6: #660044; --size-7: #390037;

  --age-0: #93f69b; --age-1: #00c6a3; --age-2: #008d95; --age-3: #005877; --age-4: #00265b;

  /* Brand / chrome. NOT the data ramp — buttons, the progress bar and the quota
     meter used to borrow --size-4/5/6 directly, which meant the treemap's
     encoding could not be changed without repainting half the UI. Same values
     the red ramp has today, so chrome is unaffected by ramp work. */
  --brand-soft: #e9b4af; --brand-mid: #dd726b; --brand: #d34b49;
  --gold: #e8a300;
  --brand-strong: #c41e29; --brand-deep: #a40a1b;

  --tile-stroke: rgba(252,252,251,.85);
  /* Ink candidates — not overridden per theme, see the note above. */
  --tile-ink-dark: #0b0b0b;
  --tile-ink-light: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, .10);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);

    --size-0: #350533; --size-1: #5d113f; --size-2: #882041; --size-3: #b23636;
    --size-4: #d75508; --size-5: #e78400; --size-6: #f5af00; --size-7: #fbdc3a;

    --age-0: #beffbd; --age-1: #1cd9b1; --age-2: #009fa8; --age-3: #00698e; --age-4: #0b3474;

  --brand-soft: #6c3531; --brand-mid: #b64340; --brand: #da4b49;
  --gold: #ffc400;
  --brand-strong: #f55f5b; --brand-deep: #ff8a82;

    --tile-stroke: rgba(26,26,25,.85);
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --plane: #0d0d0d;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --baseline: #383835;
  --border: rgba(255, 255, 255, .10);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);

  --size-0: #350533; --size-1: #5d113f; --size-2: #882041; --size-3: #b23636;
  --size-4: #d75508; --size-5: #e78400; --size-6: #f5af00; --size-7: #fbdc3a;

  --age-0: #beffbd; --age-1: #1cd9b1; --age-2: #009fa8; --age-3: #00698e; --age-4: #0b3474;

  --brand-soft: #6c3531; --brand-mid: #b64340; --brand: #da4b49;
  --gold: #ffc400;
  --brand-strong: #f55f5b; --brand-deep: #ff8a82;

  --tile-stroke: rgba(26,26,25,.85);
}

* { box-sizing: border-box; }
/* A class that sets `display` outranks the UA [hidden] rule, so `el.hidden = true`
   silently does nothing on .progress / .empty / .tip. Restore it globally. */
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body { background: var(--plane); }

.viz-root {
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--plane);
  color: var(--text-primary);
  padding: 20px;
  max-width: 1560px;
  margin: 0 auto;
  min-height: 100vh;
}

/* ── chrome ─────────────────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; flex-wrap: wrap; margin-bottom: 18px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 34px; height: 34px; flex: none; display: block; }
h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h1 .thin { font-weight: 400; color: var(--text-secondary); }
/* Release stamp. Deliberately quiet — it is reference information you go looking
   for, not something that should compete with the title. */
.ver {
  font-size: 11px; font-weight: 500; color: var(--muted);
  border: 1px solid var(--border); border-radius: 99px;
  padding: 2px 8px; margin-left: 8px; white-space: nowrap;
  vertical-align: 2px; font-variant-numeric: tabular-nums;
}
.ver:empty { display: none; }
h2 { font-size: 14px; margin: 0; font-weight: 650; }
.sub { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
.topactions { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

.field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; gap: 6px; }
select {
  font: inherit; font-size: 13px; padding: 7px 9px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
}
.btn {
  font: inherit; font-size: 13px; font-weight: 550; cursor: pointer;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); transition: .12s;
}
.btn:hover:not(:disabled) { border-color: var(--baseline); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.primary { background: var(--brand-strong); border-color: var(--brand-strong); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--brand-deep); border-color: var(--brand-deep); }
.btn.danger { background: transparent; border-color: var(--critical); color: var(--critical); }
.btn.danger:hover:not(:disabled) { background: var(--critical); color: #fff; }
.btn.ghost { background: transparent; }

.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 12px; color: var(--text-secondary); }
.progress .bar { flex: 1; height: 4px; background: var(--grid); border-radius: 99px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .2s; }

/* ── stat tiles ─────────────────────────────────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow);
}
.tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tile .v { font-size: 26px; font-weight: 640; letter-spacing: -.02em; margin: 4px 0 1px; }
.tile .n { font-size: 12px; color: var(--text-secondary); }

/* ── panels ─────────────────────────────────────────────────────────────── */
.panel {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.panelhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.count { color: var(--muted); font-weight: 400; }
.hint { font-size: 12px; color: var(--text-secondary); margin: 0 0 10px; }
.note { font-size: 12px; margin: 0 0 10px; padding: 9px 12px; border-radius: 8px;
        background: var(--plane); border: 1px solid var(--border); color: var(--text-secondary); }
.note b { color: var(--text-primary); }
.note.tool { line-height: 1.6; }
.note.tool .links { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 2px; }
.note.tool .links a {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  font-size: 12px; font-weight: 550; padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
}
.note.tool .links a:hover { border-color: var(--baseline); }
.note.tool small { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
/* Dead folders and Migration classes are stacked at every width. Halving the
   width of the dead-folder list is what made full Drive paths unreadable, and
   Migration classes is five rows of prose next to a 380px scrolling list — side
   by side it left a column of dead space and squeezed the thing people read. */
.cols.stacked { grid-template-columns: 1fr; }

.modes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 12px; padding: 6px 11px; border: 0; cursor: pointer;
  background: transparent; color: var(--text-secondary);
}
.seg button.on { background: var(--text-primary); color: var(--surface-1); }

/* ── quota meter ────────────────────────────────────────────────────────── */
.quota .hero { font-size: 21px; font-weight: 640; letter-spacing: -.02em; }
.quota .hero small { font-size: 13px; font-weight: 400; color: var(--text-secondary); }
/* The 2px gaps are the surface showing through between fills, so the track is
   surface-coloured and "free" is an explicit segment rather than the gap. */
.meter {
  display: flex; gap: 2px; height: 20px; margin: 2px 0 12px;
  background: var(--surface-1); border-radius: 6px;
}
.meter i { display: block; height: 100%; min-width: 3px; }
.meter i:first-child { border-radius: 6px 0 0 6px; }
.meter i:last-child { border-radius: 0 6px 6px 0; }
.meter i:only-child { border-radius: 6px; }

/* ── proportion bars (file types) ───────────────────────────────────────── */
/* Nominal categories: every bar takes the SAME hue. Colouring them by value
   would re-encode what the bar length already shows and waste the channel. */
.bar { flex: none; width: 84px; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
.row .ext { flex: none; font-weight: 600; min-width: 62px; }
.row .num { flex: none; font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 12px; min-width: 66px; text-align: right; }
.row .btnmeasure { flex: none; }

/* ── treemap ────────────────────────────────────────────────────────────── */
.mapwrap { padding-bottom: 12px; }
/* 600, not 480. Five levels of nesting in 480px is the single biggest reason
   the map read as busy — every tile was near its label's minimum size, so the
   text sat wall-to-wall. Height is the one dimension that buys breathing room
   without giving up any data area. */
.canvasbox { position: relative; width: 100%; height: 600px; border-radius: 10px; overflow: hidden; background: var(--plane); }
@media (max-width: 700px) { .canvasbox { height: 380px; } }
#map { width: 100%; height: 100%; display: block; cursor: pointer; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; max-width: 340px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 9px;
  padding: 9px 11px; font-size: 12px; box-shadow: var(--shadow); line-height: 1.45;
}
.tip .t { font-weight: 640; margin-bottom: 1px; word-break: break-word; }
/* Full path, unabbreviated — the on-map label is elided, so this is where you
   find out which of four "Exports" folders you are actually hovering. */
.tip .p {
  font-size: 11px; color: var(--muted); word-break: break-word;
  margin-bottom: 6px; padding-bottom: 5px; border-bottom: 1px solid var(--border);
}
/* The recommended action. It is the point of the whole tool, so it gets its own
   block rather than being one more label/value row to scan past. */
.tip .v {
  margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border);
  color: var(--text-primary); font-weight: 550;
}
.tip .h { margin-top: 5px; font-size: 10px; color: var(--muted); }
.tip .r { color: var(--text-secondary); display: flex; justify-content: space-between; gap: 14px; }
.tip .r b { color: var(--text-primary); font-weight: 550; font-variant-numeric: tabular-nums; }

/* ── workspace: map beside a tabbed rail ────────────────────────────────────
 * The panels used to stack under the map, so "read a row, look at the map" was
 * always a scroll. Side by side is what makes the selection feature legible.
 */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
.workspace > .mapwrap { margin: 0; }
@media (max-width: 1100px) { .workspace { grid-template-columns: minmax(0, 1fr); } }

.sidepanel {
  display: grid; grid-template-columns: 74px minmax(0, 1fr);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  height: 660px;
}
@media (max-width: 1100px) { .sidepanel { height: 460px; } }

.siderail {
  display: flex; flex-direction: column; gap: 2px; padding: 6px 5px;
  background: var(--plane); border-right: 1px solid var(--border);
  min-width: 0; overflow: hidden;
}
/* The rail is a fixed narrow column, so its buttons must be told they cannot
   grow — a grid item's default min-width is its content, which lets a long
   label push straight out of the rail and over the pane beside it. */
.siderail button {
  font: inherit; font-size: 10px; line-height: 1.15; text-align: center;
  background: none; border: 0; cursor: pointer; color: var(--text-secondary);
  padding: 8px 1px; border-radius: 8px; display: grid; gap: 3px; justify-items: center;
  width: 100%; min-width: 0; overflow: hidden; hyphens: auto;
}
.siderail button .tl { min-width: 0; overflow-wrap: anywhere; }
.siderail button .ic { font-size: 15px; line-height: 1; }
.siderail button:hover { background: var(--surface-1); color: var(--text-primary); }
.siderail button.on { background: var(--surface-1); color: var(--text-primary); font-weight: 600; box-shadow: inset 2px 0 0 var(--brand); }
.siderail button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }

/* These min-widths were set for a full-width two-column page. In a 380px rail
   panel they add up to more than the box, so the list scrolls sideways — which
   on a vertical list is never the right answer. Let the bar absorb the slack. */
.tabpane .list .row { min-width: 0; }
.tabpane .row .ext { min-width: 0; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
.tabpane .row .num { min-width: 0; padding-left: 8px; }
.tabpane .row .bar { flex: 1 1 auto; min-width: 30px; }

.sidebody { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 12px 10px; }
.tabpane { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.tabpane[hidden] { display: none; }
.tabpane .list { flex: 1; min-height: 0; overflow-y: auto; }
.tabpane .panelhead { margin-bottom: 6px; }
.tabpane .hint { margin: 0 0 8px; }

/* ── conversion ─────────────────────────────────────────────────────────── */
.convbanner { border-color: var(--warning); background: color-mix(in oklab, var(--warning) 9%, var(--surface-1)); }
/* Count on the side rail. Absolutely placed so it cannot widen the rail — the
   labels already sit inside 74px and a badge in flow would push them out. */
.siderail button { position: relative; }
.siderail .rc {
  position: absolute; top: 3px; right: 3px; min-width: 15px; padding: 0 3px;
  border-radius: 7px; background: var(--brand); color: #fff;
  font-size: 9px; line-height: 15px; font-variant-numeric: tabular-nums;
}
.siderail .rc[hidden] { display: none; }

/* ── conversion dialog ──────────────────────────────────────────────────── */
.dlgrow { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.warn-note { border-color: var(--serious); background: color-mix(in oklab, var(--serious) 8%, var(--surface-1)); }
.bar { height: 8px; border-radius: 4px; background: var(--plane); overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--brand); transition: width .25s; }

/* ── what-to-scan picker ────────────────────────────────────────────────── */
.picklist { display: grid; gap: 6px; margin: 12px 0 16px; max-height: 320px; overflow-y: auto; }
.pickrow {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 9px; background: var(--surface-1);
}
.pickrow:hover { background: var(--plane); }
.pickrow:has(input:checked) { border-color: var(--brand); background: color-mix(in oklab, var(--brand) 6%, var(--surface-1)); }
.pickrow input { width: 16px; height: 16px; accent-color: var(--brand); flex: none; }
.pickrow .nm { display: grid; font-size: 13px; font-weight: 560; color: var(--text-primary); }
.pickrow .nm small { font-weight: 400; font-size: 11px; color: var(--muted); }
.pickfoot { display: flex; justify-content: flex-end; gap: 8px; }

/* Right-click menu. Positioned fixed and appended inside .viz-root so the
   tokens below actually resolve — see dsOpenMenu. */
#dsMenu {
  position: fixed; z-index: 60; min-width: 210px; padding: 4px;
  background: var(--surface-1); border: 1px solid var(--baseline);
  border-radius: 8px; box-shadow: var(--shadow); font-size: 12px;
}
#dsMenu[hidden] { display: none; }
#dsMenu .hd {
  padding: 6px 10px 7px; color: var(--muted); border-bottom: 1px solid var(--border);
  margin-bottom: 4px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#dsMenu .mi { padding: 7px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
#dsMenu .mi:hover { background: var(--plane); }
#dsMenu .mi.danger { color: var(--critical); font-weight: 550; }

/* ── selection ──────────────────────────────────────────────────────────────
 * A row you can click is a row that must LOOK clickable before it is clicked;
 * a hover-only affordance is invisible to anyone who never hovers.
 */
.list .row.pick { cursor: pointer; }
.list .row.pick:hover { background: var(--plane); }
.list .row.pick:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
