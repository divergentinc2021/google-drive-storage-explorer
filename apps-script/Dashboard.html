 * Building it is a server round trip over the whole scan, and the button gave
 * no sign it had been pressed — so it was pressed again, and again. Every
 * queued call came back with its own file: fifty downloads from one intention.
 *
 * The re-entrancy guard is the fix for the fifty files. The bar and the log are
 * the fix for the cause: a control that shows nothing invites a second press,
 * and no guard makes that feel any better.
 */
var DS_CSV_BUSY = false;

function dsExportCsv() {
  if (DS_CSV_BUSY || DS_SCANNING) return;
  if (!DS_ALL.length) { dsDialog('<p>Run a scan first.</p>'); return; }

  var btn = document.getElementById('btnCsv');
  var finish = function (label) {
    DS_CSV_BUSY = false;
    dsCreepStop();
    btn.disabled = false;
    btn.textContent = label || '⤓ Manifest CSV';
    if (label) setTimeout(function () { btn.textContent = '⤓ Manifest CSV'; }, 2500);
  };

  DS_CSV_BUSY = true;
  btn.disabled = true;
  btn.textContent = 'Building…';

  dsScanDlgOpen('Building the manifest…');
  dsLogStart();
  dsLog('Classifying ' + DS_ALL.length.toLocaleString() + ' indexed items…');
  dsProgress(8, 'Classifying…');

  var rows = [];
  DS_ALL.forEach(function (n) {
    if (n.kind === KIND_FOLDER || n.synthetic) return;
    var cls, action, exp = '';
    if (n.kind === KIND_SHORTCUT) { cls = 'shortcut'; action = 'ignore'; }
    else if (n.kind === KIND_NATIVE) {
      exp = dsExportAs(n.mime) || '';
      cls = exp ? 'native-exportable' : 'native-stuck';
      action = exp ? 'export-copy-to-nas' : 'keep-in-drive';
    } else if (n.days >= DS_DEAD_DAYS) { cls = 'binary-dead'; action = 'move-to-nas-then-trash'; }
    else { cls = 'binary-active'; action = 'keep'; }
    rows.push({ id: n.id, name: n.name, path: dsPath(n), cls: cls, mime: n.mime,
                bytes: n.bytes, days: n.days, action: action, exportAs: exp,
                md5: n.md5 || '' });
  });

  var withMd5 = rows.filter(function (r) { return r.md5; }).length;
  dsLog(rows.length.toLocaleString() + ' file rows · ' + withMd5.toLocaleString() +
        ' carry a checksum', 'ok');
  if (!withMd5) {
    dsLog('No checksums in this scan — Storage Mapper will match on size + name only', 'bad');
  }
  dsLog('Asking the server to build the CSV…');
  dsProgress(22, 'Building the CSV…');
  dsCreepStart(22, 88, 'progBar', function (secs) {
    dsLog('still building — ' + secs + 's so far', 'dim');
  });

  var t0 = Date.now();
  google.script.run.withSuccessHandler(function (csv) {
    dsCreepStop();
    dsProgress(96, 'Saving…');
    dsLog('CSV ready in ' + ((Date.now() - t0) / 1000).toFixed(1) + 's — ' +
          Math.round(csv.length / 1024).toLocaleString() + ' KB', 'ok');
    try {
      var blob = new Blob([csv], { type: 'text/csv' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'studiodrive-manifest.csv';
      document.body.appendChild(a); a.click(); a.remove();
      dsProgress(100, 'Done');
      // A browser download can be entirely silent depending on settings, which
      // is half the reason the button looked dead. Say it landed, and where.
      dsLog('Saved as studiodrive-manifest.csv — load it in Storage Mapper ' +
            'under Drive manifest', 'ok');
      finish('✓ Downloaded');
      setTimeout(dsScanDlgClose, 900);
    } catch (e) {
      finish();
      dsScanDlgClose();
      dsDialog('<h3>Manifest (copy it out)</h3><pre>' + dsEsc(csv.slice(0, 200000)) + '</pre>');
    }
  }).withFailureHandler(function (err) {
    finish();
    dsFail(err);   // holds the dialog open with the error in the log
  }).buildManifestCsv(rows);
}

function dsShowRclone() {
  var fmts = (DS_BOOT && DS_BOOT.config.exportFormats) || 'docx,xlsx,pptx,svg';
  var maps = (DS_BOOT && DS_BOOT.config.mappings) || [];
  var target = maps.length ? maps[0].nasPath : '/share/GDriveBackup/studiouih';
  var src = maps.length && maps[0].driveFolderPath ? maps[0].driveFolderPath : '';

  var h = [];
  h.push('<h3>1 · One-time, on the QNAP (Container Station or Entware)</h3>');
  h.push('<pre>rclone config     # new remote, type: drive, name: gdrive\n' +
         '                  # sign in as studiouih@uwc.ac.za, scope: drive.readonly</pre>');
  h.push('<h3>2 · Pull Drive down to the NAS</h3>');
  h.push('<pre>rclone sync gdrive:' + dsEsc(src) + ' ' + dsEsc(target) + ' \\\n' +
         '  --drive-export-formats ' + dsEsc(fmts) + ' \\\n' +
         '  --drive-acknowledge-abuse --fast-list --checksum \\\n' +
         '  --transfers 8 --checkers 16 \\\n' +
         '  --log-file /share/logs/rclone-gdrive.log --log-level INFO</pre>');
  h.push('<p><code>--drive-export-formats</code> is the flag that answers the native-file ' +
         'problem: Docs/Sheets/Slides land on the NAS as real .docx/.xlsx/.pptx.</p>');
  h.push('<h3>3 · Schedule it</h3>');
  h.push('<pre># QNAP wipes a plain `crontab -e` on reboot — edit the config file instead\n' +
         'echo "30 2 * * * /opt/bin/rclone sync gdrive: ' + dsEsc(target) +
         ' --drive-export-formats ' + dsEsc(fmts) + '" >> /etc/config/crontab\n' +
         'crontab /etc/config/crontab && /etc/init.d/crond.sh restart</pre>');
  h.push('<p>Verify a restore before you empty any Drive trash. Full setup and the ' +
         'poll-agent protocol are in <code>docs/QNAP_SYNC.md</code>.</p>');
  dsDialog(h.join(''));
}

function dsDialog(html) {
  var body = document.getElementById('dlgBody');
  body.innerHTML = html;
  var d = document.getElementById('dlg');
  /*
   * The dialog ships a permanent Close in a <form method="dialog">. That is
   * right for a plain message and wrong the moment the content brings its own
   * footer — the Convert dialog showed its own Cancel/Convert aligned right and
   * this one stranded below them on the left.
   *
   * Done here rather than only in CSS: the stylesheet rule needs :has(), and a
   * layout fault that depends on selector support is one that comes back on
   * some machine later. Setting the attribute is unconditional.
   */
  /*
   * CONVENTION: a dialog body that supplies its own buttons must put them in a
   * .dlgrow. The selector also matches .pickfoot because that footer predates
   * the convention and shipped with two Close buttons for it — belt and braces,
   * since the failure is silent and only visible as a stray button.
   */
  var form = d.querySelector('form');
  if (form) form.hidden = !!body.querySelector('.dlgrow, .pickfoot');
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
}

function dsCloseDialog() {
  var d = document.getElementById('dlg');
  if (d.close) d.close(); else d.removeAttribute('open');
}

function dsToggleRelief() {
  var b = document.getElementById('btnRelief');
  var on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.textContent = on ? '◨ 3D relief' : '▭ Flat';
  tmSetRelief(on);
  document.getElementById('legend').innerHTML = tmLegendHtml();
}

function dsToggleTheme() {
  var r = document.documentElement;
  var cur = r.getAttribute('data-theme');
  if (!cur) {
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    cur = sysDark ? 'dark' : 'light';
  }
  r.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  if (DS_TREE) tmDraw();
  document.getElementById('legend').innerHTML = tmLegendHtml();
}

/**
 * "2026-07-29" -> "29 Jul 2026", by splitting the string rather than going
 * through Date. `new Date('2026-07-29')` parses as UTC midnight, so formatting
 * it in any negative-offset timezone renders the previous day — a release stamp
 * that is off by one is worse than no release stamp.
 */
function dsFmtDate(iso) {
  var M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
           'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var p = String(iso).split('-');
  if (p.length !== 3 || !M[Number(p[1]) - 1]) return String(iso);
  return Number(p[2]) + ' ' + M[Number(p[1]) - 1] + ' ' + p[0];
}

function dsEsc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', dsInit);
else dsInit();
</script>
