<script>
/*
  Dashboard logic.

  NO IIFE — see the banner in Index.html. Everything is top-level so it can see
  Treemap.html's functions and vice versa.
*/

var DS_BOOT = null;
var DS_ALL = [];        // every node, flat — lists + CSV read this
var DS_BYID = {};
var DS_TREE = null;     // folded tree — the treemap reads this
var DS_STACK = [];      // zoom breadcrumb
var DS_MIMES = [];
var DS_DEAD_DAYS = 365;
var DS_SMALL_FLOOR = 1048576;
var DS_SCANNING = false;
var DS_DRIVE_STATS = {};   // driveId -> {bytes, files, folders}, measured on demand

var KIND_FOLDER = 0, KIND_BINARY = 1, KIND_NATIVE = 2, KIND_SHORTCUT = 3;

/*
 * Preferred target per Google type, used ONLY to pick one format out of the
 * several Google offers. Whether a type is exportable at all is not decided
 * here any more — that comes from the server as DS_BOOT.exportFormats, which is
 * Drive's own about.exportFormats.
 *
 * The old version of this object WAS the exportable list, and it was a
 * hand-written guess at Google's capabilities. It had no entry for Google Vids,
 * which is exactly the gap that made the desktop app offer six .gvid stubs for
 * copying and fail all six.
 */
var PREFERRED_EXPORT = {
  'document': ['docx', 'odt', 'pdf'],
  'spreadsheet': ['xlsx', 'ods', 'csv'],
  'presentation': ['pptx', 'odp', 'pdf'],
  'drawing': ['svg', 'png', 'pdf'],
  'script': ['json'],
  'jam': ['pdf'],
  'vid': ['mp4']
};

/** mime subtype -> extension Google will actually give us, or null. */
var MIME_EXT = {
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'docx',
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': 'xlsx',
  'application/vnd.openxmlformats-officedocument.presentationml.presentation': 'pptx',
  'application/vnd.oasis.opendocument.text': 'odt',
  'application/vnd.oasis.opendocument.spreadsheet': 'ods',
  'application/vnd.oasis.opendocument.presentation': 'odp',
  'application/pdf': 'pdf', 'text/csv': 'csv', 'image/svg+xml': 'svg',
  'image/png': 'png', 'image/jpeg': 'jpg', 'text/plain': 'txt',
  'application/vnd.google-apps.script+json': 'json',
  'application/zip': 'zip', 'video/mp4': 'mp4', 'text/html': 'html'
};

// ── boot ────────────────────────────────────────────────────────────────────
function dsInit() {
  tmInit('map', 'tip', dsZoomTo, dsOpenInDrive, dsDescribe);

  /*
   * Scan scans. It used to open the picker, which meant choosing a scope in the
   * dropdown and then being asked the same question again in a dialog that
   * ignored the answer. The picker is for the first run and for picking SEVERAL
   * targets; the dropdown handles the ordinary single-scope case on its own.
   */
  document.getElementById('btnScan').addEventListener('click', dsScan);
  document.getElementById('scope').addEventListener('change', function () {
    if (this.value === '__pick__') {
      // Not a scope — an entry point back to the multi-select.
      this.value = DS_TARGETS.length > 1 ? '__multi__' : (DS_LAST_SCOPE || 'owned');
      dsShowPicker();
      return;
    }
    DS_LAST_SCOPE = this.value;
    // An explicit single choice replaces whatever the picker last set, or the
    // dropdown would silently have no effect after the picker had been used.
    DS_TARGETS = [];
    dsSyncScopeOptions();
  });
  document.getElementById('btnTheme').addEventListener('click', dsToggleTheme);
  document.getElementById('btnUp').addEventListener('click', dsZoomUp);
  document.getElementById('btnRelief').addEventListener('click', dsToggleRelief);
  document.getElementById('btnCsv').addEventListener('click', dsExportCsv);
  document.getElementById('btnRclone').addEventListener('click', function (ev) {
    ev.preventDefault();   // it is an <a> now, so it would jump to the top
    dsShowRclone();
  });
  document.getElementById('btnTrash').addEventListener('click', dsTrashSelected);
  document.getElementById('btnMeasure').addEventListener('click', dsMeasureAll);
  document.getElementById('deadAfter').addEventListener('change', function () {
    DS_DEAD_DAYS = Number(this.value);
    dsClearSel();   // the row that was selected may not survive the new threshold
    dsRenderLists();
  });

  /*
   * Selection. Delegated, because both lists are re-rendered wholesale on every
   * scan and every threshold change — per-row listeners would be re-bound each
   * time and leak the old ones.
   */
  ['typeList', 'deadList'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', function (ev) {
      var row = ev.target.closest ? ev.target.closest('.row.pick') : null;
      if (!row || !el.contains(row)) return;
      if (row.hasAttribute('data-type')) dsSelect('type', row.getAttribute('data-type'));
      else if (row.hasAttribute('data-dead')) dsSelect('dead', row.getAttribute('data-dead'));
    });
    el.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var row = ev.target.closest ? ev.target.closest('.row.pick') : null;
      if (!row) return;
      ev.preventDefault();
      row.click();
    });
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && DS_SEL) dsClearSel();
  });
  document.getElementById('btnConvert').addEventListener('click', dsOpenConvert);
  document.getElementById('scanClose').addEventListener('click', dsScanDlgClose);
  TM_AFTER_RENDER = dsResolveSel;

  // Right-click a tile. Bound once, here, so no build ends up with two menus.
  var dsCv = document.getElementById('map');
  if (dsCv) {
    dsCv.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
      var n = typeof tmNodeAt === 'function' ? tmNodeAt(ev) : null;
      if (n) dsOpenMenu(ev, n);
    });
  }

  // Side tabs. The map stays put; only the right-hand pane swaps.
  document.querySelectorAll('.siderail button').forEach(function (b) {
    b.addEventListener('click', function () { dsShowTab(b.getAttribute('data-tab')); });
  });
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.seg button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      tmSetMode(b.dataset.mode);
      document.getElementById('legend').innerHTML = tmLegendHtml();
    });
  });

  google.script.run.withSuccessHandler(dsOnBoot)
    .withFailureHandler(dsFail).getBootstrap();
}

function dsOnBoot(b) {
  DS_BOOT = b;
  DS_DEAD_DAYS = b.config.deadAfterDays || 365;
  DS_SMALL_FLOOR = b.config.smallFileFloorBytes || 1048576;
  document.getElementById('deadAfter').value = String(DS_DEAD_DAYS);
  if (b.version) {
    document.getElementById('ver').textContent =
      b.version + (b.updated ? ' · ' + dsFmtDate(b.updated) : '');
  }
  document.getElementById('acct').textContent =
    b.user + ' · ' + tmFmtBytes(b.quota.usage) +
    (b.quota.limit ? ' of ' + tmFmtBytes(b.quota.limit) : '') + ' used';

  var sel = document.getElementById('scope');
  (b.drives || []).forEach(function (d) {
    var o = document.createElement('option');
    o.value = 'drive:' + d.id;
    o.textContent = 'Shared drive: ' + d.name;
    sel.appendChild(o);
  });
  // The picker's way back in, so multi-select is not a first-run-only feature.
  var pick = document.createElement('option');
  pick.value = '__pick__';
  pick.textContent = '⋯ Choose several…';
  sel.appendChild(pick);

  dsRenderApps();
  dsRenderQuota();   // account figures need no scan — show them immediately
  dsRenderTiles();
  dsRenderDrives();
  document.getElementById('legend').innerHTML = tmLegendHtml();

  // Ask what to map straight away — the shared drives are only known now, and a
  // dropdown above the fold is the thing people miss and then scan the wrong scope.
  // The desktop build asks about disks instead, and sets this so there is one
  // startup dialog rather than two stacked on top of each other.
  if (!window.DS_SKIP_PICKER) dsShowPicker();
}

function dsFail(err) {
  DS_SCANNING = false;
  document.getElementById('btnScan').disabled = false;
  var msg = String(err && err.message || err);

  /*
   * If the scan dialog is up, keep the failure INSIDE it. The log is the record
   * of how far it got and what Drive last said, and opening a second modal over
   * it would hide exactly that. Only fall back to the generic dialog when the
   * failure came from somewhere else.
   */
  dsCreepStop();   // nothing is in flight any more
  var d = document.getElementById('scanDlg');
  if (d && d.open) {
    dsLog(msg, 'bad');
    dsScanDlgHold('Scan failed');
    return;
  }
  dsDialog('<h3>Something went wrong</h3><pre>' + dsEsc(msg) + '</pre>');
}

// ── scan ────────────────────────────────────────────────────────────────────
function dsScan() {
  if (DS_SCANNING) return;
  DS_SCANNING = true;
  DS_ALL = []; DS_BYID = {}; DS_MIMES = []; DS_STACK = [];
  document.getElementById('btnScan').disabled = true;
  document.getElementById('mapEmpty').hidden = true;
  dsProgress(0, 'Starting…');

  if (!DS_TARGETS.length) DS_TARGETS = [dsScopeTarget()];
  dsScanDlgOpen('Scanning ' + DS_TARGETS.map(function (t) { return t.name; }).join(', ') + '…');
  dsLogStart();
  dsLog('Scanning ' + DS_TARGETS.map(function (t) { return t.name; }).join(', ') +
        '. Drive is listed a page at a time, so the first answer is the slowest.');

  /*
   * Fired here, alongside the crawl, not after it. It needs nothing from the
   * scan, and the scan takes long enough that this is finished and waiting by
   * the time the map is drawn — so the tile shows the right count immediately
   * instead of correcting itself a few seconds later.
   */
  DS_CONV_NAMES = null;
  var convT0 = Date.now();
  dsFetchConvertedNames(function () {
    dsLog('Checked what is already converted (' +
          ((Date.now() - convT0) / 1000).toFixed(1) + 's) — ' +
          (DS_CONV_NAMES ? Object.keys(DS_CONV_NAMES).length.toLocaleString() + ' file(s) in ' +
            'My Drive → _Converted for NAS' : 'nothing converted yet'));
    if (!DS_SCANNING) dsApplyConvStatus();   // scan already finished; repaint now
  });

  dsScanTarget(0, 0);
}

/** Fall back to the scope dropdown when nothing was picked. */
function dsScopeTarget() {
  var raw = document.getElementById('scope').value;
  if (raw === 'all') return { name: 'Everything I can see', scope: 'all' };
  if (raw.indexOf('drive:') === 0) {
    var id = raw.slice(6);
    var d = ((DS_BOOT && DS_BOOT.drives) || []).filter(function (x) { return x.id === id; })[0];
    return { name: (d && d.name) || 'Shared drive', scope: 'all', driveId: id };
  }
  return { name: 'My Drive', scope: 'owned' };
}

/*
 * Targets run one after another, not in parallel: each is its own paged crawl,
 * and Apps Script gives the whole page a single quota — firing several at once
 * would race them into the same limit and make a partial scan look complete.
 */
function dsScanTarget(ti, seen) {
  if (ti >= DS_TARGETS.length) return dsScanDone();
  var t = DS_TARGETS[ti];
  var opts = { scope: t.scope };
  if (t.driveId) opts.driveId = t.driveId;
  dsScanStep(opts, seen, ti);
}

function dsScanStep(opts, seen, ti) {
  var page = (opts.pageToken ? 'next page' : 'first page');
  dsLog('Asking Drive for the ' + page + ' of ' + DS_TARGETS[ti].name + '…');
  var t0 = Date.now();
  /*
   * Creep from wherever the bar is toward the next real milestone. The ceiling
   * is deliberately short of it: arriving before the answer does would be a
   * lie, and the snap when the answer lands is the honest signal.
   */
  var barNow = parseFloat(document.getElementById('progBar').style.width) || 5;
  dsCreepStart(barNow, Math.min(94, barNow + 22));
  google.script.run
    .withSuccessHandler(function (res) {
      dsLog('Drive answered in ' + ((Date.now() - t0) / 1000).toFixed(1) + 's — ' +
            res.items.length.toLocaleString() + ' items' +
            (res.done ? ' (last page)' : ''), 'ok');
      // Each chunk ships its own mime dictionary; remap into the global table.
      var remap = res.mimes.map(function (m) {
        var at = DS_MIMES.indexOf(m);
        if (at === -1) { DS_MIMES.push(m); return DS_MIMES.length - 1; }
        return at;
      });

      res.items.forEach(function (t) {
        var n = {
          id: t[0], parent: t[1], name: t[2], kind: t[3],
          self: t[4], bytes: t[4], days: t[5],
          mime: DS_MIMES[remap[t[6]]] || '',
          md5: t[7] || '',
          children: [], fileCount: 0, minDays: t[5] < 0 ? 1e9 : t[5]
        };
        n.tgt = ti;   // which target this came from, for the group nodes
        DS_ALL.push(n);
        DS_BYID[n.id] = n;
      });

      var total = seen + res.items.length;
      var label = DS_TARGETS.length > 1
        ? DS_TARGETS[ti].name + ' · ' + total.toLocaleString() + ' items indexed…'
        : total.toLocaleString() + ' items indexed…';
      dsProgress(res.done && ti >= DS_TARGETS.length - 1 ? 100 : Math.min(96, 8 + total / 400), label);

      if (res.done) dsScanTarget(ti + 1, total);
      else { opts.pageToken = res.nextPageToken; dsScanStep(opts, total, ti); }
    })
    .withFailureHandler(function (err) {
      dsLog('Drive refused: ' + (err && err.message || err), 'bad');
      dsFail(err);
    })
    .scanChunk(opts);
}

/*
 * ── the running log ─────────────────────────────────────────────────────────
 *
 * A percentage and one replaced line say almost nothing during the long quiet
 * stretch before Drive answers the first page — "0 items indexed" for thirty
 * seconds is indistinguishable from a hang. A scrolling list of what has
 * happened, with elapsed time, distinguishes slow from stuck without anyone
 * having to guess.
 *
 * Capped at 400 lines: this can run for thousands of pages and an unbounded
 * log would grow the DOM until the tab crawls.
 */
var DS_LOG_T0 = 0, DS_LOG_N = 0;

/*
 * The scan dialog. Open while it runs, gone when it succeeds.
 *
 * On FAILURE it stays open with a Close button: the log is then the only record
 * of what happened, and closing it automatically would throw away the one thing
 * worth reading.
 */
function dsScanDlgOpen(title) {
  var d = document.getElementById('scanDlg');
  if (!d) return;
  document.getElementById('scanTitle').textContent = title || 'Scanning…';
  document.getElementById('scanFoot').hidden = true;
  if (!d.open) { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }
}

function dsScanDlgClose() {
  var d = document.getElementById('scanDlg');
  if (!d) return;
  if (d.close) d.close(); else d.removeAttribute('open');
}

/** Leave it up, with a way out — used when something went wrong. */
function dsScanDlgHold(title) {
  var d = document.getElementById('scanDlg');
  if (!d) return;
  document.getElementById('scanTitle').textContent = title;
  document.getElementById('scanFoot').hidden = false;
}

function dsLogStart() {
  DS_LOG_T0 = Date.now();
  DS_LOG_N = 0;
  var el = document.getElementById('runLog');
  if (el) el.innerHTML = '';
}

function dsLog(text, cls) {
  var el = document.getElementById('runLog');
  if (!el) return;
  var t = ((Date.now() - DS_LOG_T0) / 1000).toFixed(1);
  var row = document.createElement('div');
  row.className = 'lg' + (cls ? ' ' + cls : '');
  row.innerHTML = '<span class="lt">' + t + 's</span>' + dsEsc(text);
  el.appendChild(row);
  if (++DS_LOG_N > 400) { el.removeChild(el.firstChild); DS_LOG_N--; }
  el.scrollTop = el.scrollHeight;
}


/*
 * ── the bar has to move while nothing is happening ──────────────────────────
 *
 * Drive's first page took 58 seconds on a real account, and for all of it the
 * bar sat at 5% with one unchanging line under it. There is genuinely no
 * progress to report during that wait — the request is out and Google has not
 * answered — but a frozen bar is indistinguishable from a frozen app.
 *
 * So it creeps: each tick closes a fixed fraction of the gap to a CEILING it
 * never reaches. Always moving, always slowing, and it cannot overstate how far
 * along things are, because it can never arrive. A real answer stops it and
 * snaps the bar to the true figure.
 */
var DS_CREEP = null, DS_CREEP_V = 0, DS_CREEP_T0 = 0, DS_CREEP_SAID = 0;

function dsCreepStop() {
  if (DS_CREEP) { clearInterval(DS_CREEP); DS_CREEP = null; }
}

/**
 * @param from      percentage to start from
 * @param ceiling   percentage it approaches but never reaches
 * @param barId     the <i> to widen; defaults to the scan bar
 * @param say       called with elapsed seconds every 15s, for a log line
 */
function dsCreepStart(from, ceiling, barId, say) {
  dsCreepStop();
  DS_CREEP_V = from;
  DS_CREEP_T0 = Date.now();
  DS_CREEP_SAID = 0;
  DS_CREEP = setInterval(function () {
    DS_CREEP_V += (ceiling - DS_CREEP_V) * 0.05;
    var el = document.getElementById(barId || 'progBar');
    if (el) el.style.width = DS_CREEP_V.toFixed(1) + '%';

    // A line every 15s, so the log shows life too rather than one frozen entry.
    var secs = Math.floor((Date.now() - DS_CREEP_T0) / 1000);
    if (secs >= 15 && secs - DS_CREEP_SAID >= 15) {
      DS_CREEP_SAID = secs;
      if (say) say(secs);
      else dsLog('still waiting on Drive — ' + secs + 's so far', 'dim');
    }
  }, 300);
}

function dsProgress(pct, txt) {
  dsCreepStop();   // a real figure supersedes the estimate
  document.getElementById('progBar').style.width = pct + '%';
  document.getElementById('progText').textContent = txt;
}

function dsScanDone() {
  DS_SCANNING = false;
  document.getElementById('btnScan').disabled = false;
  dsProgress(100, DS_ALL.length.toLocaleString() + ' items · building map…');
  dsLog('All pages in. Building the tree and laying out ' +
        DS_ALL.length.toLocaleString() + ' items…');

  dsBuildTree();
  DS_STACK = [DS_TREE];
  tmSetRoot(DS_TREE);
  dsRenderCrumbs();
  document.getElementById('btnCsv').disabled = false;   // there is now a scan to export
  // If the parallel check has already answered, the tile shows the real count
  // on its first paint. If not, its callback repaints when it lands.
  DS_CONV_STATUS = dsComputeConvStatus();
  dsRenderTiles();
  dsRenderLists();
  document.getElementById('legend').innerHTML = tmLegendHtml();
  // A short beat so the last line is readable, then out of the way entirely.
  setTimeout(dsScanDlgClose, 700);
}

// ── tree ────────────────────────────────────────────────────────────────────
function dsBuildTree() {
  var root = {
    id: '__root__', parent: '', name: 'My Drive', kind: KIND_FOLDER,
    self: 0, bytes: 0, days: 0, mime: '', children: [], fileCount: 0, minDays: 1e9
  };
  DS_BYID['__root__'] = root;
  if (DS_TARGETS.length === 1) root.name = DS_TARGETS[0].name;
  else if (DS_TARGETS.length > 1) root.name = DS_TARGETS.length + ' locations';

  /*
   * With more than one target, each gets a group node so the map keeps them
   * apart. Without it every scanned drive dumps its top level into one root and
   * the treemap interleaves them — you would be comparing two drives while
   * unable to see where either one begins.
   *
   * Group nodes live in DS_BYID but NOT in DS_ALL: the lists iterate DS_ALL, and
   * a synthetic container would otherwise show up as a folder you could mark
   * dead or trash.
   */
  var groups = {};
  if (DS_TARGETS.length > 1) {
    DS_TARGETS.forEach(function (t, i) {
      var g = {
        id: '__t' + i + '__', parent: '__root__', name: t.name, kind: KIND_FOLDER,
        self: 0, bytes: 0, days: 0, mime: '', children: [], fileCount: 0,
        minDays: 1e9, synthetic: true
      };
      DS_BYID[g.id] = g;
      groups[i] = g;
      root.children.push(g);
    });
  }

  // Rebuilt after a trash, so children MUST be cleared first — otherwise every
  // node gets linked a second time and the map doubles.
  DS_ALL.forEach(function (n) { n.children = []; });

  DS_ALL.forEach(function (n) {
    var p = DS_BYID[n.parent];
    if (p && p !== n) p.children.push(n);
    else (groups[n.tgt] || root).children.push(n); // orphan / shared-in / top level
  });

  // Post-order rollup, iterative so a deep tree can't blow the stack.
  var order = [], stack = [root], seen = {};
  while (stack.length) {
    var n = stack.pop();
    if (seen[n.id]) continue;
    seen[n.id] = 1;
    order.push(n);
    for (var i = 0; i < n.children.length; i++) stack.push(n.children[i]);
  }
  for (var k = order.length - 1; k >= 0; k--) {
    var node = order[k];
    if (node.kind !== KIND_FOLDER) { node.fileCount = 1; continue; }
    var b = node.self, fc = 0, md = 1e9;
    for (var j = 0; j < node.children.length; j++) {
      var c = node.children[j];
      b += c.bytes; fc += c.fileCount;
      if (c.minDays < md) md = c.minDays;
    }
    node.bytes = b; node.fileCount = fc;
    node.minDays = md;
    node.days = md === 1e9 ? -1 : md; // folder freshness = its most recent file
  }

  dsFoldSmall(root);
  DS_TREE = root;
}

/**
 * Collapse sub-floor files into one synthetic tile per folder. Without this the
 * map is a haze of 1px slivers and the actual mass is unreadable.
 */
function dsFoldSmall(node) {
  if (node.kind !== KIND_FOLDER) return;
  var keep = [], small = [], bytes = 0, md = 1e9;
  node.children.forEach(function (c) {
    if (c.kind === KIND_FOLDER) { keep.push(c); dsFoldSmall(c); return; }
    if (c.bytes < DS_SMALL_FLOOR) { small.push(c); bytes += c.bytes; if (c.minDays < md) md = c.minDays; }
    else keep.push(c);
  });
  if (small.length > 1) {
    keep.push({
      id: '__small__' + node.id, parent: node.id, synthetic: true,
      name: '· ' + small.length.toLocaleString() + ' small files',
      kind: KIND_BINARY, self: bytes, bytes: bytes,
      days: md === 1e9 ? -1 : md, minDays: md, mime: '', children: [],
      fileCount: small.length
    });
  } else if (small.length === 1) keep.push(small[0]);
  node.children = keep;
}

function dsPath(n) {
  var parts = [], cur = n, guard = 0;
  while (cur && guard++ < 64) {
    parts.unshift(cur.name);
    cur = DS_BYID[cur.parent];
    if (cur && cur.id === '__root__') { parts.unshift('My Drive'); break; }
  }
  return parts.join('/');
}

// ── open in Drive ───────────────────────────────────────────────────────────
/**
 * `open?id=` resolves for every type — folder, binary, Doc, Sheet — so there is
 * no need to carry webViewLink through the scan payload just for this.
 */
function dsDriveUrl(node) {
  if (!node) return null;
  if (node.id === '__root__') return 'https://drive.google.com/drive/my-drive';
  // The folded "N small files" tile is not a real Drive object — open its folder.
  if (node.synthetic) return dsDriveUrl(DS_BYID[node.parent]);
  if (node.kind === KIND_FOLDER) {
    return 'https://drive.google.com/drive/folders/' + encodeURIComponent(node.id);
  }
  return 'https://drive.google.com/open?id=' + encodeURIComponent(node.id);
}

function dsOpenInDrive(node) {
  var url = dsDriveUrl(node);
  if (!url) return;
  var w = window.open(url, '_blank', 'noopener');
  // Apps Script serves the UI inside a sandboxed iframe, so a pop-up blocker can
  // swallow this. Hand over a link rather than failing silently.
  if (!w) {
    dsDialog('<h3>Open in Drive</h3><p>The browser blocked the new tab.</p>' +
      '<p><a href="' + dsEsc(url) + '" target="_blank" rel="noopener">' +
      dsEsc(node.name || 'Open in Drive') + ' ↗</a></p>');
  }
}

// ── hover detail ────────────────────────────────────────────────────────────
/**
 * What the treemap cannot know on its own: where a node lives, which migration
 * class it falls into, and therefore what to do with it.
 *
 * This is the other half of keeping on-map labels terse. The tile shows a
 * shortened name and a size; everything that needs room — the full path, the
 * class, the recommended action — surfaces here on hover instead of competing
 * for pixels with the data.
 *
 * @return {{path: string, rows: Array, verdict: string}}
 */
function dsDescribe(n) {
  if (!n || n.id === '__root__') return { rows: [] };
  var out = { path: '', rows: [], verdict: '' };

  var parent = DS_BYID[n.parent];
  if (n.synthetic) out.path = parent ? dsPath(parent) : '';
  else out.path = dsPath(n);

  if (n.kind === KIND_FOLDER) {
    var dead = n.fileCount > 0 && n.minDays >= DS_DEAD_DAYS;
    out.rows.push(['Oldest file', tmFmtDays(n.minDays === 1e9 ? -1 : n.minDays)]);
    out.verdict = dead
      ? '⇠ Every file idle past ' + dsDaysLabel(DS_DEAD_DAYS) + ' — safe to move to the NAS'
      : '✓ Has activity inside ' + dsDaysLabel(DS_DEAD_DAYS) + ' — leave in Drive';
    return out;
  }

  if (n.synthetic) {
    out.rows.push(['Rolled up', n.fileCount.toLocaleString() + ' files under ' +
                   tmFmtBytes(DS_SMALL_FLOOR)]);
    out.verdict = 'Folded together so the map stays readable — zoom the folder to itemise';
    return out;
  }

  if (n.kind === KIND_SHORTCUT) {
    out.verdict = '↗ Shortcut — a pointer, zero storage. Ignore.';
    return out;
  }

  if (n.kind === KIND_NATIVE) {
    var as = dsExportAs(n.mime);
    out.rows.push(['Quota used', '~0 — Google-native']);
    out.verdict = as
      ? '⤓ Exports as .' + as + '. Copy for backup; deleting frees nothing.'
      : '⚑ No export path (Form, Site, My Map). Must stay in Drive.';
    return out;
  }

  // Binary: the only class where moving it actually reclaims quota.
  if (n.days >= DS_DEAD_DAYS) {
    out.rows.push(['Class', 'Dead binary']);
    out.verdict = '⨯ Idle past ' + dsDaysLabel(DS_DEAD_DAYS) +
                  ' — move to the NAS, then trash. Reclaims ' + tmFmtBytes(n.bytes) + '.';
  } else {
    out.rows.push(['Class', 'Active binary']);
    out.verdict = '✓ Touched recently — leave in Drive.';
  }
  if (n.md5) out.rows.push(['md5', n.md5.slice(0, 10) + '…']);
  return out;
}

// ── zoom ────────────────────────────────────────────────────────────────────
function dsZoomTo(node) {
  DS_STACK.push(node);
  tmSetRoot(node);
  dsRenderCrumbs();
}
function dsZoomUp() {
  if (DS_STACK.length < 2) return;
  DS_STACK.pop();
  tmSetRoot(DS_STACK[DS_STACK.length - 1]);
  dsRenderCrumbs();
}
function dsRenderCrumbs() {
  var el = document.getElementById('crumbs');
  el.innerHTML = '';
  DS_STACK.forEach(function (n, i) {
    if (i) { var s = document.createElement('span'); s.className = 'sep'; s.textContent = '›'; el.appendChild(s); }
    var b = document.createElement('button');
    b.textContent = n.name;
    if (i === DS_STACK.length - 1) b.className = 'cur';
    b.addEventListener('click', function () {
      DS_STACK = DS_STACK.slice(0, i + 1);
      tmSetRoot(n);
      dsRenderCrumbs();
    });
    el.appendChild(b);
  });
  document.getElementById('btnUp').disabled = DS_STACK.length < 2;
}

// ── quota meter ─────────────────────────────────────────────────────────────
/**
 * Breaks the account quota into its real parts. The three Drive numbers are not
 * siblings: `inTrash` is a SUBSET of `inDrive`, and `usage` also counts Gmail
 * and Photos — so live Drive is inDrive-inTrash, and anything left over after
 * inDrive is the other Google services.
 */
function dsQuotaParts() {
  var q = DS_BOOT.quota;
  var live = Math.max(0, q.inDrive - q.inTrash);
  var other = Math.max(0, q.usage - q.inDrive);
  var free = q.limit ? Math.max(0, q.limit - q.usage) : 0;
  return { live: live, trash: q.inTrash, other: other, free: free,
           usage: q.usage, limit: q.limit, capped: !!q.limit };
}

function dsRenderQuota() {
  if (!DS_BOOT) return;
  var p = dsQuotaParts();
  var denom = p.capped ? p.limit : (p.usage || 1);

  document.getElementById('quotaHero').innerHTML = p.capped
    ? dsEsc(tmFmtBytes(p.free)) + ' free <small>of ' + dsEsc(tmFmtBytes(p.limit)) +
      ' · ' + (100 * p.usage / p.limit).toFixed(1) + '% used</small>'
    : dsEsc(tmFmtBytes(p.usage)) + ' used <small>· no storage cap published for this account</small>';

  var segs = [
    // Brand tokens, not ramp steps: these are nominal categories, so they must
    // not shift when the treemap's sequential encoding is retuned.
    { k: 'live', label: 'Drive files (live)', v: p.live, c: 'var(--brand-strong)' },
    { k: 'trash', label: 'Drive trash', v: p.trash, c: 'var(--brand-mid)' },
    { k: 'other', label: 'Gmail + Photos', v: p.other, c: 'var(--brand-soft)' }
  ];
  if (p.capped) segs.push({ k: 'free', label: 'Free', v: p.free, c: 'var(--grid)' });

  document.getElementById('quotaMeter').innerHTML = segs
    .filter(function (s) { return s.v > 0; })
    .map(function (s) {
      return '<i style="width:' + (100 * s.v / denom).toFixed(3) + '%;background:' + s.c +
             '" title="' + dsEsc(s.label + ' — ' + tmFmtBytes(s.v)) + '"></i>';
    }).join('');

  // Every segment is labelled with its value — the meter never relies on colour.
  document.getElementById('quotaLegend').innerHTML = '<div class="keys">' + segs.map(function (s) {
    return '<span class="key"><i style="background:' + s.c + '"></i>' +
           dsEsc(s.label) + ' · ' + dsEsc(tmFmtBytes(s.v)) + '</span>';
  }).join('') + '</div>';

  document.getElementById('quotaNote').innerHTML =
    'Google reports one Drive figure of <b>' + dsEsc(tmFmtBytes(DS_BOOT.quota.inDrive)) +
    '</b> that already includes the trash; the meter splits the two, so “live” plus trash ' +
    'is that total. Trashed files are <b>still billed</b> until the trash is emptied. ' +
    (p.capped ? '' : 'Workspace pooled storage publishes no per-user cap, so there is no “free” figure to show. ') +
    'Shared drives are excluded — they bill to their own pool.';
}

// ── tiles ───────────────────────────────────────────────────────────────────
function dsRenderTiles() {
  if (!DS_BOOT) return;
  var q = DS_BOOT.quota;
  var tiles = [
    { k: 'In Drive', v: tmFmtBytes(q.inDrive), n: 'live files + trash' },
    { k: 'In trash', v: tmFmtBytes(q.inTrash), n: 'still billed — empty it to reclaim' },
    { k: 'Shared drives', v: (DS_BOOT.driveCount || 0).toLocaleString(),
      n: 'billed separately from your quota' }
  ];
  if (DS_TREE) {
    var s = dsSummary();
    tiles.splice(2, 0,
      { k: 'Dead & reclaimable', v: tmFmtBytes(s.deadBytes),
        n: s.deadFiles.toLocaleString() + ' binaries idle > ' + dsDaysLabel(DS_DEAD_DAYS) },
      { k: 'Google-native files', v: s.nativeCount.toLocaleString(),
        n: 'export job — frees ~0 space', key: 'native' },
      { k: 'Indexed', v: s.fileTotal.toLocaleString() + ' files',
        n: 'in ' + s.folderTotal.toLocaleString() + ' folders · this scan only' });
  }
  document.getElementById('tiles').innerHTML = tiles.map(function (t) {
    return '<div class="tile' + (t.key === 'native' ? ' act' : '') + '">' +
           '<div class="k">' + dsEsc(t.k) + '</div><div class="v">' +
           dsEsc(t.v) + '</div><div class="n">' + dsEsc(t.n) + '</div>' +
           (t.key === 'native' ? '<div class="ta" id="nativeAction"></div>' : '') +
           '</div>';
  }).join('');
  dsRenderNativeTile();
}

/*
 * The convert action lives in the Google-native tile rather than in a banner of
 * its own.
 *
 * It was a full-width yellow slab between the tiles and the map — visible, but
 * reading as an interruption rather than as part of the dashboard. The count it
 * acts on is already a tile, sitting beside In Drive and In trash, so the
 * action belongs on that tile. One number, one place.
 */
function dsRenderNativeTile() {
  var el = document.getElementById('nativeAction');
  if (!el) return;

  var can = 0, cannot = 0;
  DS_ALL.forEach(function (n) {
    if (n.kind !== KIND_NATIVE || !n.mime) return;
    if (dsExportAs(n.mime)) can++; else cannot++;
  });

  var st = DS_CONV_STATUS;
  var todo = st && st.checked ? st.pending : can;
  var done = st && st.checked ? st.converted : 0;

  if (!can && !cannot) { el.innerHTML = ''; return; }

  if (todo) {
    el.innerHTML =
      (done ? '<span class="tdone">' + done.toLocaleString() + ' converted</span>' : '') +
      '<button class="btn sm" id="convBannerGo">⤓ Convert ' + todo.toLocaleString() + '…</button>';
    document.getElementById('convBannerGo').addEventListener('click', dsOpenConvert);
    return;
  }

  el.innerHTML = done
    ? '<span class="tdone ok">✓ ' + done.toLocaleString() + ' converted</span>' +
      (cannot ? '<span class="tdone">' + cannot.toLocaleString() + ' cannot be</span>' : '')
    : '<span class="tdone">' + cannot.toLocaleString() + ' have no export path</span>';
}

function dsDaysLabel(d) {
  if (d >= 365) return (d / 365) + (d === 365 ? ' year' : ' years');
  return (d / 30) + ' months';
}

function dsSummary() {
  var s = { deadBytes: 0, deadFiles: 0, nativeCount: 0, nativeExportable: 0,
            nativeStuck: 0, activeBytes: 0, activeFiles: 0, shortcuts: 0,
            fileTotal: 0, folderTotal: 0 };
  DS_ALL.forEach(function (n) {
    if (n.kind === KIND_FOLDER) { s.folderTotal++; return; }
    s.fileTotal++;
    if (n.kind === KIND_SHORTCUT) { s.shortcuts++; return; }
    if (n.kind === KIND_NATIVE) {
      s.nativeCount++;
      if (dsExportAs(n.mime)) s.nativeExportable++; else s.nativeStuck++;
      return;
    }
    if (n.days >= DS_DEAD_DAYS) { s.deadBytes += n.bytes; s.deadFiles++; }
    else { s.activeBytes += n.bytes; s.activeFiles++; }
  });
  return s;
}

/**
 * What Google will actually convert this native into, or null if it will not.
 *
 * Asks the server's copy of about.exportFormats first. Falls back to nothing —
 * NOT to a guess: claiming an export path that does not exist is what sends
 * someone off to copy a file that can never be produced.
 */
function dsExportAs(mime) {
  if (!mime || mime.indexOf('application/vnd.google-apps.') !== 0) return null;
  var key = mime.slice(28);
  var offered = DS_BOOT && DS_BOOT.exportFormats ? DS_BOOT.exportFormats[key] : null;
  if (!offered || !offered.length) return null;

  var exts = offered.map(function (m) { return MIME_EXT[m] || null; }).filter(Boolean);
  if (!exts.length) return null;
  // Prefer the format we would actually want, else take whatever Google leads with.
  var want = PREFERRED_EXPORT[key] || [];
  for (var i = 0; i < want.length; i++) {
    if (exts.indexOf(want[i]) !== -1) return want[i];
  }
  return exts[0];
}

// ── lists ───────────────────────────────────────────────────────────────────
function dsRenderLists() {
  if (!DS_TREE) return;
  dsRenderTiles();
  dsRenderDead();
  dsRenderClasses();
  dsRenderTypes();
  dsRenderBig();
}

function dsRenderDead() {
  var dead = DS_ALL.filter(function (n) {
    return n.kind === KIND_FOLDER && n.fileCount > 0 &&
           n.minDays >= DS_DEAD_DAYS && n.bytes > 0;
  });
  // Keep only the topmost dead folder of any dead chain — listing a dead
  // folder AND all its dead children is noise, and moving the parent moves them.
  var ids = {};
  dead.forEach(function (n) { ids[n.id] = 1; });
  var tops = dead.filter(function (n) { return !ids[n.parent]; })
                 .sort(function (a, b) { return b.bytes - a.bytes; });

  document.getElementById('deadCount').textContent =
    '· ' + tops.length.toLocaleString() + ' (' + tmFmtBytes(tops.reduce(function (a, n) { return a + n.bytes; }, 0)) + ')';

  var el = document.getElementById('deadList');
  if (!tops.length) { el.innerHTML = '<div class="empty-list">No folders fully idle past this threshold.</div>'; return; }
  el.innerHTML = tops.slice(0, 200).map(function (n) {
    return '<div class="row pick" data-dead="' + dsEsc(n.id) + '" tabindex="0" ' +
      'title="Show this folder on the map"><span class="pill serious">⇠ move</span>' +
      '<span class="nm">' + dsEsc(n.name) + '<small>' + dsEsc(dsPath(n)) + ' · ' +
      n.fileCount.toLocaleString() + ' files</small></span>' +
      '<span class="sz">' + tmFmtBytes(n.bytes) + '</span>' +
      '<span class="ag">' + tmFmtDays(n.minDays) + '</span>' +
      '<a class="open" href="' + dsEsc(dsDriveUrl(n)) + '" target="_blank" rel="noopener" ' +
      'title="Open this folder in Drive">↗</a></div>';
  }).join('');
}

function dsRenderClasses() {
  var s = dsSummary();
  var rows = [
    { pill: 'critical', icon: '⨯', t: 'Dead binaries', n: s.deadFiles,
      b: s.deadBytes, d: 'Move to NAS, then trash. This is the only row that frees quota.' },
    { pill: 'good', icon: '✓', t: 'Active binaries', n: s.activeFiles,
      b: s.activeBytes, d: 'Touched recently — leave in Drive.' },
    { pill: 'warning', icon: '⤓', t: 'Native, exportable', n: s.nativeExportable,
      b: 0, d: 'Google will convert these. Copy for backup; deleting frees nothing.' },
    { pill: 'serious', icon: '⚑', t: 'Native, not exportable', n: s.nativeStuck,
      b: 0, d: 'Google offers no export format — these must stay in Drive.' },
    { pill: 'good', icon: '↗', t: 'Shortcuts', n: s.shortcuts,
      b: 0, d: 'Pointers only — zero storage.' }
  ];
  /*
   * Per-type breakdown, straight from Drive's about.exportFormats. This is the
   * screen that answers "can this actually be converted?" for a specific type,
   * with Google's own answer rather than an assumption baked into this file.
   */
  var byType = {};
  DS_ALL.forEach(function (n) {
    if (n.kind !== KIND_NATIVE || !n.mime) return;
    var key = n.mime.slice(28);
    if (!byType[key]) byType[key] = { key: key, n: 0, as: dsExportAs(n.mime) };
    byType[key].n++;
  });
  var types = Object.keys(byType).map(function (k) { return byType[k]; })
    .sort(function (a, b) { return b.n - a.n; });

  // Only offer conversion when Google says something here is actually convertible.
  var can = types.filter(function (t) { return t.as; })
                 .reduce(function (a, t) { return a + t.n; }, 0);
  var cannot = types.filter(function (t) { return !t.as; })
                    .reduce(function (a, t) { return a + t.n; }, 0);

  var conv = document.getElementById('btnConvert');
  if (conv) {
    conv.disabled = !can;
    conv.textContent = can ? '⤓ Convert ' + can.toLocaleString() + '…' : '⤓ Convert…';
    conv.title = can
      ? 'Export these into real files, beside the originals'
      : types.length ? 'Google offers no export format for these types'
                     : 'No Google-native files in this scan';
  }

  // A count on the rail, so the tab advertises that it has something to say.
  var badge = document.getElementById('classCount');
  if (badge) {
    badge.hidden = !(can + cannot);
    badge.textContent = (can + cannot).toLocaleString();
  }

  dsRenderConvBanner(can, cannot);

  var detail = types.length
    ? '<div class="row"><span class="nm"><small><b>What Google says it will convert</b> — ' +
      'reported by the Drive API for this account, not assumed here.</small></span></div>' +
      types.map(function (t) {
        return '<div class="row"><span class="pill ' + (t.as ? 'warning' : 'serious') + '">' +
          dsEsc(t.key) + '</span><span class="nm"><small>' +
          (t.as ? 'exports as <b>.' + dsEsc(t.as) + '</b>'
                : 'Google offers no export format — nothing can be produced from it') +
          '</small></span><span class="ag">' + t.n.toLocaleString() +
          (t.n === 1 ? ' file' : ' files') + '</span></div>';
      }).join('')
    : '';

  document.getElementById('classList').innerHTML = rows.map(function (r) {
    return '<div class="row"><span class="pill ' + r.pill + '">' + r.icon + ' ' + dsEsc(r.t) + '</span>' +
      '<span class="nm"><small>' + dsEsc(r.d) + '</small></span>' +
      '<span class="sz">' + (r.b ? tmFmtBytes(r.b) : '~0') + '</span>' +
      '<span class="ag">' + r.n.toLocaleString() + (r.n === 1 ? ' file' : ' files') + '</span></div>';
  }).join('') + detail;
}

/*
 * Natives are the one thing that silently cannot reach the NAS, so say it where
 * it will be read. The desktop app now refuses to copy them at all, which is
 * correct but leaves the user with a list and no next step — this is the step.
 */
var DS_CONV_STATUS = null;   // {converted, pending} from the server, or null

/* The convert affordance now lives on the Google-native tile. */
function dsRenderConvBanner() { dsRenderNativeTile(); }

/*
 * The converted-file names, fetched ONCE and compared locally.
 *
 * This used to be a server call that took the native ids and did a
 * Drive.Files.get for each of them — 161 round trips asking Drive for a name
 * and a mimeType the scan had already collected. It also could not start until
 * the scan finished, so the tile sat on the wrong number and the answer only
 * arrived after a visible pause.
 *
 * Now the server returns only what the client cannot know (what is in the
 * destination folder) and the comparison happens here against DS_ALL. Nothing
 * in it depends on the scan, so it is fired the moment Scan is pressed and is
 * normally waiting by the time the crawl ends.
 */
var DS_CONV_NAMES = null;   // { 'Plan.docx': 1, … } or null until it answers

function dsFetchConvertedNames(then) {
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.checked) { DS_CONV_NAMES = null; if (then) then(); return; }
      var set = {};
      (r.names || []).forEach(function (n) { set[n] = 1; });
      DS_CONV_NAMES = set;
      if (then) then();
    })
    .withFailureHandler(function () { DS_CONV_NAMES = null; if (then) then(); })
    .convertedNames();
}

/** Every extension Google offers for this native type, not just the preferred one. */
function dsCandidateExts(mime) {
  if (!mime || mime.indexOf('application/vnd.google-apps.') !== 0) return [];
  var offered = DS_BOOT && DS_BOOT.exportFormats ? DS_BOOT.exportFormats[mime.slice(28)] : null;
  if (!offered) return [];
  var out = [];
  offered.forEach(function (m) {
    var e = MIME_EXT[m];
    if (e && out.indexOf(e) === -1) out.push(e);
  });
  return out;
}

/** Converted vs pending, computed from the scan — no further server calls. */
function dsComputeConvStatus() {
  if (!DS_CONV_NAMES) return null;
  var converted = 0, pending = 0;
  DS_ALL.forEach(function (n) {
    if (n.kind !== KIND_NATIVE || !n.mime || n.synthetic) return;
    var exts = dsCandidateExts(n.mime);
    if (!exts.length) return;                 // impossible, so neither
    var done = exts.some(function (e) { return DS_CONV_NAMES[n.name + '.' + e]; });
    if (done) converted++; else pending++;
  });
  return { checked: true, converted: converted, pending: pending };
}

function dsApplyConvStatus() {
  DS_CONV_STATUS = dsComputeConvStatus();
  dsRenderTiles();     // the count and the action both live on the tile
  dsRenderClasses();
}

/** Re-read the destination and repaint — used after a conversion run. */
function dsCheckConverted() {
  dsFetchConvertedNames(dsApplyConvStatus);
}

/*
 * ── selection: a side-panel row answered on the map ──────────────────────────
 *
 * One implementation for both lists. A file type resolves to many scattered
 * tiles; a dead folder resolves to one. The difference is only the predicate,
 * so the machinery — resolve to tiles, light them, list where they are, clear
 * on Escape or a second click — is shared.
 */
/*
 * ── right-click a tile ──────────────────────────────────────────────────────
 *
 * The shell — element, positioning, dismissal — is shared. The ITEMS are not:
 * this build trashes to Drive through a server that checks the NAS first, the
 * desktop build moves to the Recycle Bin through a path classifier. Same menu,
 * different verbs, so an app replaces DS_MENU_BUILD rather than rebuilding the
 * menu and ending up with two of them bound to one contextmenu event.
 */
var DS_MENU_BUILD = null;
var DS_MENU_NODE = null;

function dsMenuItems(n) {
  if (DS_MENU_BUILD) return DS_MENU_BUILD(n);
  var items = [];
  if (n.kind === KIND_FOLDER) items.push({ label: 'Zoom to this folder', act: 'zoom' });
  items.push({ label: 'Open in Drive', act: 'open' });
  /*
   * Files only, deliberately. Trashing a FOLDER would take everything inside it
   * in one call, and the NAS gate this app relies on is per-file — so a folder
   * trash is exactly the operation that would slip unverified files past the
   * check that exists to stop that.
   */
  if (n.kind !== KIND_FOLDER) {
    items.push({ label: 'Move to Drive trash…', act: 'trash', danger: true });
  }
  return items;
}

function dsCloseMenu() {
  var m = document.getElementById('dsMenu');
  if (m) { m.hidden = true; }
  DS_MENU_NODE = null;
}

function dsOpenMenu(ev, n) {
  var m = document.getElementById('dsMenu');
  if (!m) {
    m = document.createElement('div');
    m.id = 'dsMenu';
    m.hidden = true;
    // Into #app, not <body> — the design tokens are scoped to .viz-root, and a
    // menu outside it resolves every var() to nothing and renders unstyled.
    (document.getElementById('app') || document.body).appendChild(m);
    document.addEventListener('click', dsCloseMenu);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') dsCloseMenu(); });
    window.addEventListener('resize', dsCloseMenu);
  }
  DS_MENU_NODE = n;
  var items = dsMenuItems(n);
  m.innerHTML = '<div class="hd">' + dsEsc(n.name || '/') + '</div>' +
    items.map(function (it, i) {
      return '<div class="mi' + (it.danger ? ' danger' : '') + '" data-i="' + i + '">' +
        dsEsc(it.label) + '</div>';
    }).join('');
  m.hidden = false;

  // Flip rather than overflow: a menu opened near the right or bottom edge must
  // stay on screen, and it can only be measured once it is laid out.
  var r = m.getBoundingClientRect();
  var x = ev.clientX, y = ev.clientY;
  if (x + r.width > window.innerWidth - 6) x = Math.max(6, x - r.width);
  if (y + r.height > window.innerHeight - 6) y = Math.max(6, y - r.height);
  m.style.left = x + 'px';
  m.style.top = y + 'px';

  m.querySelectorAll('.mi').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      var it = items[Number(el.getAttribute('data-i'))];
      dsCloseMenu();
      dsMenuAct(it, n);
    });
  });
}

function dsMenuAct(it, n) {
  if (it.run) return it.run(n);
  if (it.act === 'zoom') return dsZoomTo(n);
  if (it.act === 'open') return dsOpenInDrive(n);
  if (it.act === 'trash') return dsTrashNode(n);
}

/** Trash one file, through the same server call and the same gate as the button. */
function dsTrashNode(n) {
  var msg = 'Move "' + n.name + '" (' + tmFmtBytes(n.bytes) + ') to the Drive trash?\n\n' +
    'This is reversible — Drive holds trashed files for 30 days.\n' +
    'Quota is NOT freed until the trash is emptied, which this tool never does.' +
    (DS_BOOT && DS_BOOT.caps.nasVerify ? '' :
      '\n\nNAS verification is OFF: this file is not confirmed backed up.');
  if (!window.confirm(msg)) return;
  google.script.run
    .withSuccessHandler(function (r) {
      if (r.trashed.length) {
        var i = DS_ALL.indexOf(DS_BYID[n.id]);
        if (i > -1) DS_ALL.splice(i, 1);
        delete DS_BYID[n.id];
        dsBuildTree();
        DS_STACK = [DS_TREE];
        tmSetRoot(DS_TREE);
        dsRenderCrumbs();
        dsRenderLists();
        dsDialog('<h3>Moved to trash</h3><p>' + dsEsc(n.name) + '</p>' +
          '<p>Quota is unchanged until you empty the Drive trash manually.</p>');
      } else if (r.skipped.length) {
        dsDialog('<h3>Not trashed</h3><p>The server refused: this file is not confirmed ' +
          'backed up on the NAS.</p>');
      } else {
        dsDialog('<h3>Not trashed</h3><pre>' +
          dsEsc((r.failed[0] && r.failed[0].reason) || 'Unknown error') + '</pre>');
      }
    })
    .withFailureHandler(dsFail)
    .trashFiles([n.id]);
}

/*
 * Switching tabs does NOT clear the selection. Picking .mov on the File types
 * tab and then opening Dead folders to cross-check is a normal move, and losing
 * the gold every time you look at something else would make the pairing useless.
 */
function dsShowTab(id) {
  document.querySelectorAll('.siderail button').forEach(function (b) {
    var on = b.getAttribute('data-tab') === id;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('.tabpane').forEach(function (p) { p.hidden = p.id !== id; });
}

/*
 * ── what to scan ────────────────────────────────────────────────────────────
 *
 * A dialog at boot instead of a dropdown you might never notice. Ticking more
 * than one draws them side by side in a single treemap, which is the only way
 * to compare a shared drive against your own without running the tool twice.
 */
var DS_TARGETS = [];
var DS_LAST_SCOPE = null;

/*
 * Keep the dropdown telling the truth about what will be scanned.
 *
 * The picker can select several targets, which no single <option> can express,
 * so a synthetic one is added and removed as needed. Without this the dropdown
 * would keep displaying "Files I own" after the picker had chosen three shared
 * drives — two controls for one setting, disagreeing.
 */
function dsSyncScopeOptions() {
  var sel = document.getElementById('scope');
  if (!sel) return;
  var multi = sel.querySelector('option[value="__multi__"]');
  if (DS_TARGETS.length > 1) {
    if (!multi) {
      multi = document.createElement('option');
      multi.value = '__multi__';
      sel.insertBefore(multi, sel.firstChild);
    }
    multi.textContent = DS_TARGETS.length + ' locations';
    sel.value = '__multi__';
  } else {
    if (multi) multi.remove();
    if (DS_TARGETS.length === 1) {
      var t = DS_TARGETS[0];
      var want = t.driveId ? 'drive:' + t.driveId : t.scope;
      if (sel.querySelector('option[value="' + want + '"]')) sel.value = want;
    }
  }
}

function dsPickerHtml() {
  /*
   * "Everything I can see" first and ticked by default: it is what people
   * actually scan. "My Drive" answers a narrower question — what counts against
   * MY quota — and putting it first meant the common case needed two clicks and
   * the default answer was the uncommon one.
   */
  var rows = [
    { key: 'all', name: 'Everything I can see', sub: 'Includes files shared with you', scope: 'all' },
    { key: 'owned', name: 'My Drive', sub: 'Only files you own — what counts against your quota', scope: 'owned' }
  ];
  ((DS_BOOT && DS_BOOT.drives) || []).forEach(function (d) {
    rows.push({ key: 'drive:' + d.id, name: d.name, sub: 'Shared drive',
                scope: 'all', driveId: d.id });
  });
  DS_PICK_ROWS = rows;
  return '<h3>What should I map?</h3>' +
    '<p class="hint">Tick one or more. They are drawn side by side in a single ' +
    'treemap, so you can compare them directly.</p>' +
    '<div class="picklist">' + rows.map(function (r, i) {
      return '<label class="pickrow"><input type="checkbox" data-i="' + i + '"' +
        (r.key === 'all' ? ' checked' : '') + '>' +
        '<span class="nm">' + dsEsc(r.name) + '<small>' + dsEsc(r.sub) + '</small></span></label>';
    }).join('') + '</div>' +
    // dlgrow as well as pickfoot: dsDialog suppresses the built-in Close only
    // for a body carrying .dlgrow, and this footer had its own class, so the
    // picker kept showing TWO closes — its own Cancel and a stray one below.
    '<div class="pickfoot dlgrow"><button class="btn ghost" id="pickCancel">Cancel</button>' +
    '<button class="btn" id="pickGo">Scan</button></div>';
}
var DS_PICK_ROWS = [];

function dsShowPicker() {
  dsDialog(dsPickerHtml());
  var go = document.getElementById('pickGo');
  var sync = function () {
    go.disabled = !document.querySelectorAll('.pickrow input:checked').length;
  };
  document.querySelectorAll('.pickrow input').forEach(function (c) {
    c.addEventListener('change', sync);
  });
  sync();
  document.getElementById('pickCancel').addEventListener('click', dsCloseDialog);
  go.addEventListener('click', function () {
    DS_TARGETS = [].slice.call(document.querySelectorAll('.pickrow input:checked'))
      .map(function (c) { return DS_PICK_ROWS[Number(c.getAttribute('data-i'))]; });
    dsCloseDialog();
    dsSyncScopeOptions();   // the dropdown must show what was actually chosen
    dsScan();
  });
}

var DS_SEL = null;   // { kind:'type'|'dead', key: string }

/*
 * Which drawn tile stands for this node?
 *
 * Not "the node's own rect" — at depth 5+ or inside a folded "small files"
 * bucket there isn't one. Walk up until a tile that was actually painted is
 * found. That tile is both the honest answer to "where is it" and the thing
 * the user can click.
 */
function dsTileFor(node, idx) {
  var by = DS_BYID, n = node, guard = 0;
  while (n && guard++ < 64) {
    if (idx.terminal[n.id]) return n.id;
    n = by[n.parent];
  }
  // Nothing terminal on the path — fall back to the deepest painted ancestor,
  // marked so the renderer rings it instead of filling it.
  n = node; guard = 0;
  while (n && guard++ < 64) {
    if (idx.present[n.id]) return '^' + n.id;
    n = by[n.parent];
  }
  return null;
}

function dsRectIndex() {
  var terminal = {}, present = {};
  for (var i = 0; i < TM_RECTS.length; i++) {
    var r = TM_RECTS[i];
    if (r.depth === 0) continue;
    present[r.node.id] = 1;
    if (r.terminal) terminal[r.node.id] = 1;
  }
  return { terminal: terminal, present: present };
}

function dsClearSel() {
  DS_SEL = null;
  tmClearHighlight();
  var bar = document.getElementById('selBar');
  if (bar) { bar.hidden = true; bar.innerHTML = ''; }
  var i, els = document.querySelectorAll('.row.sel');
  for (i = 0; i < els.length; i++) els[i].classList.remove('sel');
}

function dsSelect(kind, key) {
  if (DS_SEL && DS_SEL.kind === kind && DS_SEL.key === key) { dsClearSel(); return; }
  dsClearSel();
  if (!TM_RECTS || !TM_RECTS.length) return;
  DS_SEL = { kind: kind, key: key };
  dsResolveSel();
}

/** Zoom, then let the selection re-light itself against the new layout. */
function dsGoto(node) { if (node) tmSetRoot(node); }

function dsResolveSel() {
  if (!DS_SEL || !TM_RECTS || !TM_RECTS.length) return;
  var kind = DS_SEL.kind, key = DS_SEL.key;

  var by = DS_BYID, idx = dsRectIndex();
  var match = [], i, n;
  if (kind === 'type') {
    for (i = 0; i < DS_ALL.length; i++) {
      n = DS_ALL[i];
      if (n.kind === KIND_FOLDER || n.synthetic) continue;
      if (dsTypeLabel(n) === key) match.push(n);
    }
  } else {
    n = by[key];
    if (n) match.push(n);
  }

  // Resolve to tiles, and tally the holding folders while we are walking.
  var tiles = {}, folders = {}, bytes = 0, order = [];
  for (i = 0; i < match.length; i++) {
    n = match[i];
    bytes += n.bytes || 0;
    var t = dsTileFor(n, idx);
    if (t) tiles[t] = 1;
    var holder = kind === 'type' ? by[n.parent] : n;
    if (holder) {
      if (!folders[holder.id]) { folders[holder.id] = { n: holder, c: 0, b: 0 }; order.push(holder.id); }
      folders[holder.id].c++;
      folders[holder.id].b += n.bytes || 0;
    }
  }

  var ids = Object.keys(tiles);
  tmSetHighlight(ids);

  var list = order.map(function (id) { return folders[id]; })
                  .sort(function (a, b) { return b.b - a.b; });
  dsRenderSelBar(kind, key, match.length, bytes, list, ids.length);

  // Mark the originating row.
  var sel = document.querySelector('.row[data-' + kind + '="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]');
  if (sel) sel.classList.add('sel');
}

function dsRenderSelBar(kind, key, count, bytes, folders, tileCount) {
  var bar = document.getElementById('selBar');
  if (!bar) return;
  var head = kind === 'type'
    ? count.toLocaleString() + ' ' + dsEsc(key) + (count === 1 ? ' file' : ' files') +
      ' · ' + tmFmtBytes(bytes) + ' · ' + folders.length.toLocaleString() +
      (folders.length === 1 ? ' folder' : ' folders')
    : dsEsc(key && folders[0] ? folders[0].n.name : 'folder') + ' · ' + tmFmtBytes(bytes);

  var note = tileCount
    ? tileCount.toLocaleString() + (tileCount === 1 ? ' tile' : ' tiles') + ' lit'
    : 'not visible at this zoom';

  var rows = folders.slice(0, 40).map(function (f) {
    return '<button class="selrow" data-goto="' + dsEsc(f.n.id) + '">' +
      '<span class="nm">' + dsEsc(f.n.name || '/') + '<small>' + dsEsc(dsPath(f.n)) + '</small></span>' +
      (kind === 'type' ? '<span class="num">' + f.c.toLocaleString() + '</span>' : '') +
      '<span class="sz">' + tmFmtBytes(f.b) + '</span></button>';
  }).join('');
  if (folders.length > 40) {
    rows += '<div class="selmore">+ ' + (folders.length - 40).toLocaleString() + ' more</div>';
  }

  bar.innerHTML =
    '<div class="selhead"><b>' + head + '</b><span class="selnote">' + note + '</span>' +
    '<button class="selx" id="selClose" title="Clear selection" aria-label="Clear selection">✕</button></div>' +
    '<div class="sellist">' + rows + '</div>';
  bar.hidden = false;

  document.getElementById('selClose').addEventListener('click', dsClearSel);
  var btns = bar.querySelectorAll('.selrow'), i;
  for (i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      dsGoto(DS_BYID[this.getAttribute('data-goto')]);
    });
  }
}

/*
 * ── converting natives ──────────────────────────────────────────────────────
 *
 * Preview first, always. This writes files into someone's Drive, and the first
 * thing anyone should be able to do is read the list and decline.
 */
var DS_CONV_QUEUE = [], DS_CONV_DONE = 0, DS_CONV_FAILED = [], DS_CONV_SKIPPED = 0;
var DS_CONV_FELLBACK = 0, DS_CONV_LOG = [];

function dsNativeIds() {
  return DS_ALL.filter(function (n) {
    return n.kind === KIND_NATIVE && n.id && !n.synthetic;
  }).map(function (n) { return n.id; });
}

function dsOpenConvert() {
  var ids = dsNativeIds();
  if (!ids.length) return;
  dsDialog('<h3>Convert Google files</h3><p class="hint">Asking Drive what it will convert…</p>');
  google.script.run
    .withSuccessHandler(dsShowConvertPlan)
    .withFailureHandler(dsFail)
    .previewConversion(ids);
}

function dsShowConvertPlan(p) {
  var conv = p.convertible || [], imp = p.impossible || [];
  var byExt = {};
  conv.forEach(function (c) { byExt[c.as] = (byExt[c.as] || 0) + 1; });
  var byKind = {};
  imp.forEach(function (c) { byKind[c.kind] = (byKind[c.kind] || 0) + 1; });

  dsDialog(
    '<h3>Convert Google files</h3>' +
    '<p class="hint">Google exports each file into <b>My Drive → _Converted for NAS</b>, keeping the ' +
    'original\'s folder structure underneath it. Nothing is modified, moved or deleted, and files ' +
    'already converted are skipped.</p>' +
    '<div class="note"><small>Written to <b>your</b> Drive rather than beside the original, because ' +
    'most originals live in other people\'s Drives: you cannot write there, and Drive for Desktop ' +
    'would never sync the result down to your machine. Add that folder as a Google Drive source in ' +
    'Storage Mapper once the files appear.</small></div>' +
    (p.alreadyDone
      ? '<div class="note"><b>' + p.alreadyDone.toLocaleString() + ' already converted</b> — ' +
        'these are skipped, not done again.</div>'
      : '') +
    (conv.length
      ? '<div class="note"><b>' + conv.length.toLocaleString() + ' file(s) still to convert</b>' +
        '<div style="margin-top:5px">' +
        Object.keys(byExt).map(function (e) {
          return '<div>· ' + byExt[e].toLocaleString() + ' → <b>.' + dsEsc(e) + '</b></div>';
        }).join('') + '</div></div>'
      : p.alreadyDone
        ? '<div class="note">Nothing left to convert.</div>'
        : '<div class="note">Nothing here can be converted.</div>') +
    (imp.length
      ? '<div class="note warn-note"><b>' + imp.length.toLocaleString() + ' cannot be converted</b> — ' +
        'Google offers no export format for them, so no tool can produce a file.<div style="margin-top:5px">' +
        Object.keys(byKind).map(function (k) {
          return '<div>· ' + byKind[k].toLocaleString() + ' × ' + dsEsc(k) + '</div>';
        }).join('') + '</div></div>'
      : '') +
    '<div class="note"><small>Converted copies are real files and <b>use Drive quota</b> until you ' +
    'delete them after they reach the NAS. Anything over roughly 10 MB will be refused by Google\'s ' +
    'export limit and reported here.</small></div>' +
    '<div class="dlgrow">' +
    '<button class="btn ghost" id="convCancel">Cancel</button>' +
    (conv.length ? '<button class="btn" id="convGo">Convert ' + conv.length.toLocaleString() +
      (p.alreadyDone ? ' remaining' : '') + '</button>' : '') +
    '</div>');

  document.getElementById('convCancel').addEventListener('click', dsCloseDialog);
  if (conv.length) {
    document.getElementById('convGo').addEventListener('click', function () {
      DS_CONV_QUEUE = conv.map(function (c) { return c.id; });
      DS_CONV_DONE = 0; DS_CONV_FAILED = []; DS_CONV_SKIPPED = 0; DS_CONV_FELLBACK = 0;
      DS_CONV_LOG = [{ cls: 'dim', text: 'Starting — ' + conv.length.toLocaleString() +
        ' file(s), in batches of about 90 seconds.' }];
      dsRunConvert();
    });
  }
}

/*
 * Driven in chunks because one Apps Script call cannot outlive six minutes. The
 * server returns whatever it did not reach as `remaining` and we call again —
 * the same continuation the scan uses.
 */
function dsRunConvert() {
  /*
   * `total` is the QUEUE, which now holds only what is left — previewConversion
   * filters out anything already converted. It used to be handed every native
   * in the scan, so a run with one file to do announced "Converting 0 of 161"
   * and then skipped 160, which read as though it were starting over.
   */
  var total = DS_CONV_DONE + DS_CONV_QUEUE.length + DS_CONV_FAILED.length + DS_CONV_SKIPPED;
  var pct = total ? (100 * DS_CONV_DONE / total) : 0;

  /*
   * Built ONCE, then updated in place. Re-rendering the whole dialog per batch
   * threw away the log's scroll position every 90 seconds, so a run you were
   * reading kept yanking itself back to the bottom.
   */
  if (!document.getElementById('convBar')) {
    dsDialog('<h3 id="convHead"></h3>' +
      '<p class="hint" id="convHint"></p>' +
      '<div class="bar"><i id="convBar" style="width:0%"></i></div>' +
      '<div class="runlog inline" id="convLog"></div>');
  }
  document.getElementById('convHead').textContent = 'Converting ' + total.toLocaleString() +
    (total === 1 ? ' file…' : ' remaining files…');
  document.getElementById('convHint').textContent =
    DS_CONV_DONE.toLocaleString() + ' of ' + total.toLocaleString() +
    ' done. Each batch runs for about 90 seconds — leave this tab open.';
  document.getElementById('convBar').style.width = pct.toFixed(1) + '%';
  dsPaintConvLog();

  /*
   * A batch runs for up to 90 seconds and reports nothing until it returns, so
   * the bar stood still for the whole of it — the same stall the scan had. It
   * creeps toward the fraction ONE batch would reach, never past it, and the
   * real figure replaces the estimate the moment the batch answers.
   */
  var perBatch = total ? (100 / total) * Math.max(1, DS_CONV_QUEUE.length) : 0;
  dsCreepStart(pct, Math.min(97, pct + Math.max(4, perBatch * 0.8)), 'convBar', function (secs) {
    DS_CONV_LOG.push({ cls: 'dim', text: 'still working — ' + secs + 's into this batch' });
    dsPaintConvLog();
  });

  var t0 = Date.now();
  google.script.run
    .withSuccessHandler(function (r) {
      dsCreepStop();   // the batch answered; the estimate is superseded
      var secs = ((Date.now() - t0) / 1000).toFixed(0);
      /*
       * Per FILE, not per batch. A batch line only says a number moved; naming
       * what converted, what fell back to a lighter format and what refused is
       * what makes a run diagnosable while it is still running — every fault in
       * this feature so far was identified from exactly these lines.
       */
      (r.done || []).forEach(function (d) {
        DS_CONV_LOG.push({ cls: 'ok', text: (d.fellBack
          ? d.name + ' — fell back to .' + d.as + ' (.' + d.fellBack + ' was over the export limit)'
          : d.name) });
      });
      (r.skipped || []).forEach(function (s) {
        DS_CONV_LOG.push({ cls: 'dim', text: s.name + ' — already converted' });
      });
      (r.failed || []).forEach(function (f) {
        DS_CONV_LOG.push({ cls: 'bad', text: f.name + ' — ' + f.why });
      });
      DS_CONV_LOG.push({ cls: 'dim', text: '— batch finished in ' + secs + 's, ' +
        (r.remaining || []).length.toLocaleString() + ' still queued —' });

      DS_CONV_DONE += (r.done || []).length;
      DS_CONV_FELLBACK += (r.done || []).filter(function (d) { return d.fellBack; }).length;
      DS_CONV_SKIPPED += (r.skipped || []).length;
      DS_CONV_FAILED = DS_CONV_FAILED.concat(r.failed || []);
      DS_CONV_QUEUE = r.remaining || [];
      if (DS_CONV_QUEUE.length) dsRunConvert();
      else dsConvertDone();
    })
    .withFailureHandler(function (err) {
      dsCreepStop();
      DS_CONV_LOG.push({ cls: 'bad', text: 'The batch failed: ' + (err && err.message || err) });
      dsConvertDone();
    })
    .convertNatives(DS_CONV_QUEUE);
}

/* The dialog is rebuilt every batch, so the log has to be re-painted into it. */
function dsPaintConvLog() {
  var el = document.getElementById('convLog');
  if (!el) return;
  el.innerHTML = DS_CONV_LOG.slice(-300).map(function (l) {
    return '<div class="lg ' + l.cls + '">' + dsEsc(l.text) + '</div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function dsConvertDone() {
  dsCreepStop();
  dsDialog('<h3>Conversion finished</h3>' +
    '<div class="note"><b>' + DS_CONV_DONE.toLocaleString() + '</b> file(s) converted' +
    (DS_CONV_FELLBACK ? ' (<b>' + DS_CONV_FELLBACK + '</b> in a lighter format, because the ' +
      'preferred one was over Google\'s export limit)' : '') +
    (DS_CONV_SKIPPED ? ' · <b>' + DS_CONV_SKIPPED.toLocaleString() + '</b> already done' : '') +
    (DS_CONV_FAILED.length ? ' · <b>' + DS_CONV_FAILED.length.toLocaleString() + '</b> could not be' : '') +
    '</div>' +
    (DS_CONV_FAILED.length
      ? '<div class="note warn-note">' + DS_CONV_FAILED.slice(0, 25).map(function (f) {
          return '<div>· ' + dsEsc(f.name) + ' — ' + dsEsc(f.why) + '</div>';
        }).join('') +
        (DS_CONV_FAILED.length > 25
          ? '<div>· …and ' + (DS_CONV_FAILED.length - 25).toLocaleString() + ' more</div>' : '') +
        '</div>'
      : '') +
    '<div class="note"><small>Drive for Desktop will sync <b>My Drive → _Converted for NAS</b> down. ' +
    'Add that folder as a Google Drive source in <b>Storage Mapper</b> and it copies them to the NAS ' +
    'like any other file — they have contents now, so they pass its readability check.</small></div>' +
    '<div class="dlgrow"><button class="btn" id="convClose">Close</button></div>');
  document.getElementById('convClose').addEventListener('click', function () {
    dsCloseDialog();
    // Re-check rather than re-scan: the converted files are real and belong in
    // the map, but a full re-scan of a large Drive to update one banner is a
    // heavy answer to a light question. dsScan is still there on the button.
    DS_CONV_STATUS = null;
    dsCheckConverted();
  });
}

// ── storage by file type ────────────────────────────────────────────────────
function dsTypeLabel(n) {
  if (n.kind === KIND_SHORTCUT) return 'shortcut';
  if (n.kind === KIND_NATIVE) return 'Google ' + (n.mime.slice(28) || 'file');
  var m = /\.([A-Za-z0-9]{1,6})$/.exec(n.name || '');
  if (m) return m[1].toLowerCase();
  return tmShortMime(n.mime);
}

function dsRenderTypes() {
  var agg = {};
  DS_ALL.forEach(function (n) {
    if (n.kind === KIND_FOLDER || n.synthetic) return;
    var k = dsTypeLabel(n);
    if (!agg[k]) agg[k] = { ext: k, bytes: 0, count: 0 };
    agg[k].bytes += n.bytes;
    agg[k].count++;
  });
  var rows = Object.keys(agg).map(function (k) { return agg[k]; })
    .sort(function (a, b) { return b.bytes - a.bytes || b.count - a.count; })
    .slice(0, 14);

  var el = document.getElementById('typeList');
  if (!rows.length) { el.innerHTML = '<div class="empty-list">Run a scan first.</div>'; return; }
  var max = rows[0].bytes || 1;
  el.innerHTML = rows.map(function (r) {
    var pct = Math.max(r.bytes > 0 ? 2 : 0, 100 * r.bytes / max);
    return '<div class="row pick" data-type="' + dsEsc(r.ext) + '" tabindex="0" ' +
      'title="Show every ' + dsEsc(r.ext) + ' on the map">' +
      '<span class="ext">' + dsEsc(r.ext) + '</span>' +
      '<span class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></span>' +
      '<span class="nm"></span>' +
      '<span class="sz">' + (r.bytes ? tmFmtBytes(r.bytes) : '~0') + '</span>' +
      '<span class="num">' + r.count.toLocaleString() + '</span></div>';
  }).join('');
}

// ── shared drives ───────────────────────────────────────────────────────────
function dsRenderDrives() {
  var drives = (DS_BOOT && DS_BOOT.drives) || [];
  document.getElementById('driveCount').textContent = '· ' + drives.length;
  var el = document.getElementById('driveList');
  if (!drives.length) {
    el.innerHTML = '<div class="empty-list">No shared drives reachable from this account.</div>';
    document.getElementById('btnMeasure').disabled = true;
    return;
  }
  el.innerHTML = drives.map(function (d) {
    var m = DS_DRIVE_STATS[d.id];
    return '<div class="row" data-drive="' + dsEsc(d.id) + '">' +
      '<span class="nm">' + dsEsc(d.name) + '<small class="dstat">' +
      (m ? m.files.toLocaleString() + ' files · ' + m.folders.toLocaleString() + ' folders'
         : 'not measured') + '</small></span>' +
      '<span class="sz dsize">' + (m ? tmFmtBytes(m.bytes) : '—') + '</span>' +
      '<button class="btn ghost sm btnmeasure">' + (m ? 'Re-measure' : 'Measure') + '</button>' +
      '<a class="open" href="https://drive.google.com/drive/folders/' + dsEsc(d.id) +
      '" target="_blank" rel="noopener" title="Open this shared drive">↗</a></div>';
  }).join('');
  el.querySelectorAll('.btnmeasure').forEach(function (b) {
    b.addEventListener('click', function () {
      dsMeasureDrive(b.closest('.row').dataset.drive);
    });
  });
}

function dsMeasureDrive(driveId, onDone) {
  var row = document.querySelector('#driveList .row[data-drive="' + driveId + '"]');
  var btn = row && row.querySelector('.btnmeasure');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  var acc = { bytes: 0, files: 0, folders: 0 };

  function step(token) {
    google.script.run
      .withSuccessHandler(function (r) {
        acc.bytes += r.bytes; acc.files += r.files; acc.folders += r.folders;
        if (row) {
          row.querySelector('.dsize').textContent = tmFmtBytes(acc.bytes);
          row.querySelector('.dstat').textContent = r.done
            ? acc.files.toLocaleString() + ' files · ' + acc.folders.toLocaleString() + ' folders'
            : acc.files.toLocaleString() + ' files so far…';
        }
        if (!r.done) { step(r.nextPageToken); return; }
        DS_DRIVE_STATS[driveId] = acc;
        if (btn) { btn.disabled = false; btn.textContent = 'Re-measure'; }
        if (onDone) onDone();
      })
      .withFailureHandler(function (e) {
        if (btn) { btn.disabled = false; btn.textContent = 'Retry'; }
        if (row) row.querySelector('.dstat').textContent = 'failed: ' + (e && e.message || e);
        if (onDone) onDone();
      })
      .measureDriveChunk({ driveId: driveId, pageToken: token });
  }
  step(null);
}

/** Sequential, not parallel — each drive scan is already a paginated server loop. */
function dsMeasureAll() {
  var drives = (DS_BOOT && DS_BOOT.drives) || [];
  var btn = document.getElementById('btnMeasure');
  btn.disabled = true; btn.textContent = 'Measuring…';
  var i = 0;
  function next() {
    if (i >= drives.length) { btn.disabled = false; btn.textContent = 'Re-measure all'; return; }
    dsMeasureDrive(drives[i++].id, next);
  }
  next();
}

function dsBigCandidates() {
  return DS_ALL.filter(function (n) {
    return n.kind === KIND_BINARY && n.days >= DS_DEAD_DAYS && n.bytes > 0;
  }).sort(function (a, b) { return b.bytes - a.bytes; });
}

function dsRenderBig() {
  var all = dsBigCandidates();
  var rows = all.slice(0, 300);
  var el = document.getElementById('bigList');

  // The rail badge and the heading carry the size, because this is the one list
  // that answers "how much would this actually free".
  var bytes = all.reduce(function (a, n) { return a + (n.bytes || 0); }, 0);
  var badge = document.getElementById('bigCount');
  if (badge) {
    badge.hidden = !all.length;
    badge.textContent = all.length > 999 ? '999+' : String(all.length);
  }
  var hd = document.getElementById('bigBytes');
  if (hd) hd.textContent = all.length ? '· ' + tmFmtBytes(bytes) : '';

  if (!rows.length) { el.innerHTML = '<div class="empty-list">Nothing idle past this threshold.</div>'; return; }
  // A <label> would hijack the open-link click into a checkbox toggle, so the
  // row is a div and the toggle is wired explicitly.
  el.innerHTML = rows.map(function (n) {
    return '<div class="row pick"><input type="checkbox" data-id="' + dsEsc(n.id) + '">' +
      '<span class="nm">' + dsEsc(n.name) + '<small>' + dsEsc(dsPath(n)) + ' · ' +
      dsEsc(tmShortMime(n.mime)) + '</small></span>' +
      '<span class="sz">' + tmFmtBytes(n.bytes) + '</span>' +
      '<span class="ag">' + tmFmtDays(n.days) + '</span>' +
      '<a class="open" href="' + dsEsc(dsDriveUrl(n)) + '" target="_blank" rel="noopener" ' +
      'title="Open this file in Drive">↗</a></div>';
  }).join('');
  el.querySelectorAll('input[type=checkbox]').forEach(function (cb) {
    cb.addEventListener('change', dsUpdateTrashBtn);
  });
  el.querySelectorAll('.row.pick').forEach(function (row) {
    row.addEventListener('click', function (ev) {
      if (ev.target.closest('a.open') || ev.target.tagName === 'INPUT') return;
      var cb = row.querySelector('input[type=checkbox]');
      cb.checked = !cb.checked;
      dsUpdateTrashBtn();
    });
  });
  dsUpdateTrashBtn();
}

function dsSelectedIds() {
  return Array.prototype.slice
    .call(document.querySelectorAll('#bigList input[type=checkbox]:checked'))
    .map(function (cb) { return cb.dataset.id; });
}

function dsUpdateTrashBtn() {
  var ids = dsSelectedIds();
  var btn = document.getElementById('btnTrash');
  btn.disabled = !ids.length;
  var bytes = ids.reduce(function (a, id) { return a + ((DS_BYID[id] || {}).bytes || 0); }, 0);
  // Short, because this now lives in a 380px rail rather than a full-width bar.
  // The confirm dialog still spells out that it is the Drive trash and reversible.
  btn.textContent = ids.length
    ? 'Trash ' + ids.length + ' · ' + tmFmtBytes(bytes)
    : 'Trash selected';
  btn.title = ids.length
    ? 'Move ' + ids.length + ' file(s) to the Drive trash — reversible, kept 30 days'
    : 'Tick the files you want moved to the Drive trash';
}

/*
 * ── the companion desktop tools ─────────────────────────────────────────────
 *
 * Each keeps its own product mark rather than a generic download glyph. All
 * three live in the same taskbar, so a shared icon is a coin flip every time
 * someone clicks one — the same reasoning that gave Storage Mapper a different
 * motif from this app in the first place.
 *
 *   Explorer  four treemap blocks     (this app)
 *   Mapper    two blocks bridged      "map this side onto that side"
 *   Disk      treemap inside a screen  same map, local disks
 */
var DS_APP_MARKS = {
  mapper:
    '<svg viewBox="0 0 24 24" class="am" aria-hidden="true">' +
    '<rect x="1.5" y="4" width="7.5" height="16" rx="1.6"/>' +
    '<rect x="10.6" y="10.6" width="2.8" height="2.8" rx="0.7" opacity=".9"/>' +
    '<rect x="15" y="4" width="7.5" height="16" rx="1.6" opacity=".62"/></svg>',
  desktop:
    '<svg viewBox="0 0 24 24" class="am" aria-hidden="true">' +
    '<rect x="1.6" y="3.4" width="20.8" height="14.4" rx="2" fill="none" ' +
    'stroke="currentColor" stroke-width="1.7"/>' +
    '<path d="M9 21h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>' +
    '<rect x="4.4" y="6.2" width="7" height="4.6" rx="0.8"/>' +
    '<rect x="12.4" y="6.2" width="7.2" height="4.6" rx="0.8" opacity=".78"/>' +
    '<rect x="4.4" y="11.6" width="7" height="3.6" rx="0.8" opacity=".6"/>' +
    '<rect x="12.4" y="11.6" width="7.2" height="3.6" rx="0.8" opacity=".44"/></svg>'
};

function dsRenderApps() {
  var el = document.getElementById('apps');
  if (!el || !DS_BOOT || !DS_BOOT.siblingApps) return;
  el.innerHTML = DS_BOOT.siblingApps.map(function (a) {
    return '<span class="appchip" tabindex="0">' +
      (DS_APP_MARKS[a.key] || '') +
      '<span class="an">' + dsEsc(a.name) + '</span>' +
      '<span class="av">' + dsEsc(a.version) + '</span>' +
      '<span class="appcard">' +
        '<b>' + dsEsc(a.full) + ' <span class="av">' + dsEsc(a.version) + '</span></b>' +
        '<span class="ad">' + dsEsc(a.desc) + '</span>' +
        /*
         * target="_blank" everywhere. This page runs inside Apps Script's
         * sandboxed iframe, which blocks top-level navigation, so a same-tab
         * link fails outright — that was the "refused to connect". The download
         * attribute does not help either: it is ignored cross-origin.
         */
        '<span class="al">' +
          '<a href="' + dsEsc(a.download) + '" target="_blank" rel="noopener">⤓ Download the installer</a>' +
          '<a href="' + dsEsc(a.readme) + '" target="_blank" rel="noopener">How it works</a>' +
          (a.drive
            ? '<a href="' + dsEsc(a.drive) + '" target="_blank" rel="noopener">Drive copy</a>'
            : '') +
        '</span>' +
        '<span class="an-note">' + dsEsc(a.asset || '') +
        (a.live
          ? ' — newest release, read from GitHub.'
          : ' — GitHub could not be reached, so this is the last version this app knew of.') +
        '</span>' +
      '</span></span>';
  }).join('');
}

/*
 * The NAS-verification banner is gone — see the note in Index.html. The SERVER
 * gate is untouched: trashFiles still refuses anything getVerifiedIds has not
 * confirmed whenever V_NAS_VERIFY is on, and both confirms still say plainly
 * that nothing is verified while it is off. Only the ambient announcement went.
 */

// ── actions ─────────────────────────────────────────────────────────────────
function dsTrashSelected() {
  var ids = dsSelectedIds();
  if (!ids.length) return;
  var bytes = ids.reduce(function (a, id) { return a + ((DS_BYID[id] || {}).bytes || 0); }, 0);
  var msg = 'Move ' + ids.length + ' file(s), ' + tmFmtBytes(bytes) + ', to the Drive trash?\n\n' +
    'This is reversible — Drive holds trashed files for 30 days.\n' +
    'Quota is NOT freed until the trash is emptied, which this tool never does.' +
    (DS_BOOT && DS_BOOT.caps.nasVerify ? '' :
      '\n\nNAS verification is OFF: these files are not confirmed backed up.');
  if (!window.confirm(msg)) return;

  var btn = document.getElementById('btnTrash');
  btn.disabled = true; btn.textContent = 'Working…';
  google.script.run
    .withSuccessHandler(function (r) {
      // Report what the SERVER says it did — never assume the request succeeded.
      var lines = ['<h3>Result</h3><p>Trashed: <b>' + r.trashed.length + '</b></p>'];
      if (r.skipped.length) lines.push('<p>Skipped (not confirmed on NAS): <b>' + r.skipped.length + '</b></p>');
      if (r.failed.length) {
        lines.push('<p>Failed: <b>' + r.failed.length + '</b></p><pre>' +
          dsEsc(r.failed.map(function (f) { return f.id + ' — ' + f.reason; }).join('\n')) + '</pre>');
      }
      lines.push('<p>Quota is unchanged until you empty the Drive trash manually.</p>');
      dsDialog(lines.join(''));
      r.trashed.forEach(function (id) {
        var i = DS_ALL.indexOf(DS_BYID[id]);
        if (i > -1) DS_ALL.splice(i, 1);
        delete DS_BYID[id];
      });
      dsBuildTree();
      DS_STACK = [DS_TREE];
      tmSetRoot(DS_TREE);
      dsRenderCrumbs();
      dsRenderLists();
    })
    .withFailureHandler(function (e) { dsUpdateTrashBtn(); dsFail(e); })
    .trashFiles(ids);
}

/*
 * The manifest gets the same dialog the scan uses, for the same reason.
 *
