<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Google Drive Storage Explorer">
  <!--
    App icon. The rounded red square is the dashboard's own .logo mark; the four
    blocks inside are a treemap partition, and their opacity follows the size
    ramp (largest = most opaque) so the icon says what the app does.
    Deliberately only four blocks — anything finer turns to mush at 16px.
    Gradient stops are the validated ramp: size-7 -> size-5 -> size-1.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a40a1b"/>
      <stop offset="0.55" stop-color="#d34b49"/>
      <stop offset="1" stop-color="#eed4d1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" ry="114" fill="url(#g)"/>

  <!--
    Opacity floor is 0.52, not the ramp's true bottom: at 16px anything fainter
    disappears into the light end of the gradient and the icon reads as a plain
    red square. The four steps still descend, so the ordering survives.
    Gaps are 18px (3.5%) for the same reason — 8px vanished when scaled down.
  -->
  <g fill="#ffffff">
    <rect x="96"  y="96"  width="190" height="180" rx="10" opacity="1"/>
    <rect x="304" y="96"  width="112" height="180" rx="10" opacity="0.84"/>
    <rect x="96"  y="294" width="190" height="122" rx="10" opacity="0.68"/>
    <rect x="304" y="294" width="112" height="122" rx="10" opacity="0.52"/>
  </g>
</svg>
