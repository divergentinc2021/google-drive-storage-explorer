# Build and publish the Disk Storage Explorer installer.
#
# Triggered by a `desktop-v*` tag, not `v*`: the plain namespace belongs to the
# Apps Script web app and its 200 lifetime deployment versions. Two products in
# one repo, two tag namespaces, no collisions.
#
# Modelled closely on storage-mapper's release.yml, which is known to build and
# publish. An earlier version of this file used job-level `defaults.run
# .working-directory` and a step-level `continue-on-error`; GitHub reported it as
# a workflow-file issue (0 jobs, and `gh workflow list` printed the PATH where the
# name should be, which is the tell that `name:` could not be read). Every run
# step now carries its own `working-directory` instead.
name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Tag must match package.json
        working-directory: desktop
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#desktop-v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag desktop-v$tag does not match desktop/package.json $pkg."
            exit 1
          fi

      # The renderer is generated from ../apps-script, so a stale ui/ would ship
      # last week's treemap. Always rebuild; never trust a committed copy.
      - name: Assemble the UI
        working-directory: desktop
        run: node build-ui.mjs

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Publish release
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::electron-builder produced no .exe in desktop/dist/"
            ls -la dist || true
            exit 1
          fi
          printf 'publishing %s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "Disk Storage Explorer $GITHUB_REF_NAME" \
            --generate-notes

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Keep the newest desktop release only. The installer is ~80 MB and the git
      # tag survives the prune, so any version can still be checked out and built.
      # Filtered to desktop-v* so it can never touch another product's releases.
      - name: Prune old desktop releases, keep their tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          keep=1
          mapfile -t tags < <(gh release list --repo "$REPO" --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName | select(startswith("desktop-v"))')
          echo "found ${#tags[@]} desktop release(s), keeping $keep"
          if [ "${#tags[@]}" -le "$keep" ]; then
            echo "nothing to prune"
            exit 0
          fi
          for t in "${tags[@]:$keep}"; do
            echo "deleting release $t (git tag kept)"
            gh release delete "$t" --repo "$REPO" --yes
          done
